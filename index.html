<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SETTLED — Chapter One: The Suit</title>
  <style>
    :root{
      color-scheme:dark;
      --desk:#070503; --desk2:#171108; --lamp:#f1c76a; --paper:#ead8aa; --paper2:#cdb783;
      --ink:#1c1308; --red:#9f2f25; --green:#4f805c; --blue:#526b7f; --line:rgba(238,218,176,.22);
      --muted:rgba(238,218,176,.65); --shadow:0 30px 90px rgba(0,0,0,.68);
      --serif:Georgia,"Times New Roman",serif; --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--desk);color:var(--paper);font-family:var(--sans);overflow-x:hidden}
    body{background:radial-gradient(circle at 50% -12%,rgba(241,199,106,.28),transparent 36%),radial-gradient(circle at 88% 8%,rgba(159,47,37,.16),transparent 30%),linear-gradient(140deg,#050403 0%,#171108 52%,#050403 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:42px 42px;opacity:.18;z-index:0} body:after{content:"";position:fixed;inset:-8%;pointer-events:none;background:radial-gradient(ellipse at center,transparent 0%,transparent 42%,rgba(0,0,0,.62) 78%,rgba(0,0,0,.9) 100%);z-index:1}
    button{font:inherit;color:inherit;cursor:pointer}.app{position:relative;z-index:2;width:min(1280px,100%);margin:0 auto;min-height:100vh;padding:18px clamp(12px,3vw,32px) 132px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.seal{width:44px;height:44px;border-radius:16px;border:1px solid rgba(241,199,106,.38);background:radial-gradient(circle at 32% 22%,#4e371a,#090604 72%);display:grid;place-items:center;font:900 22px var(--serif);color:var(--lamp);letter-spacing:-.08em;box-shadow:0 0 34px rgba(241,199,106,.16)}.brand h1{margin:0;font:900 clamp(28px,5vw,52px)/.88 var(--serif);letter-spacing:-.055em}.brand p{margin:4px 0 0;color:var(--muted);font:800 10px var(--mono);text-transform:uppercase;letter-spacing:.13em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runtime{border:1px solid var(--line);border-radius:999px;padding:9px 11px;background:rgba(0,0,0,.28);font:800 11px var(--mono);color:var(--paper2);white-space:nowrap}
    .desk{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:stretch}.stage{position:relative;min-height:680px;border:1px solid rgba(241,199,106,.14);border-radius:34px;background:radial-gradient(circle at 44% 18%,rgba(241,199,106,.12),transparent 38%),linear-gradient(145deg,rgba(255,255,255,.045),rgba(0,0,0,.32));box-shadow:var(--shadow);overflow:hidden}.stage:before{content:"";position:absolute;inset:26px;border:1px solid rgba(238,218,176,.08);border-radius:28px;pointer-events:none}.string{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(159,47,37,.82),transparent);box-shadow:0 0 12px rgba(159,47,37,.22);pointer-events:none}.s1{left:22%;top:27%;width:330px;transform:rotate(-13deg)}.s2{left:35%;top:57%;width:420px;transform:rotate(9deg)}.photo{position:absolute;right:38px;top:38px;width:172px;height:124px;border:8px solid #e6d5aa;background:linear-gradient(135deg,#28221b,#090705);transform:rotate(5deg);box-shadow:0 14px 30px rgba(0,0,0,.45);pointer-events:none}.photo:before{content:"NATO / THE HAGUE";position:absolute;left:8px;bottom:8px;color:rgba(238,218,176,.72);font:900 9px var(--mono);letter-spacing:.1em}.stamp{position:absolute;right:-28px;bottom:56px;font:900 clamp(82px,14vw,174px)/.8 var(--sans);letter-spacing:-.08em;color:rgba(238,218,176,.045);transform:rotate(-8deg);pointer-events:none}
    .folder{position:absolute;left:50%;top:52%;width:min(760px,calc(100% - 34px));min-height:525px;transform:translate(-50%,-50%) rotate(-1deg);background:linear-gradient(180deg,#f1dfb0,#d2b06a);border-radius:18px 18px 24px 24px;color:var(--ink);box-shadow:0 30px 72px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.45);transition:.24s ease}.folder.shift{opacity:.22;transform:translate(-50%,-47%) rotate(2deg) scale(.98)}.folder:before{content:"";position:absolute;left:28px;top:-29px;width:225px;height:44px;background:#d4b36e;border-radius:16px 16px 0 0}.folder:after{content:"CONFIDENTIAL CASE FILE";position:absolute;right:24px;top:18px;color:rgba(28,19,8,.2);font:900 12px var(--mono);letter-spacing:.14em}.paper{position:relative;margin:46px clamp(16px,4vw,48px) 82px;padding:clamp(20px,4vw,38px);min-height:390px;background:linear-gradient(180deg,#fff1cb,#e7d09a);border-radius:10px;box-shadow:0 18px 34px rgba(70,42,13,.26),inset 0 0 0 1px rgba(255,255,255,.62);color:var(--ink)}.paper:before{content:"";position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(28,19,8,.06) 32px);pointer-events:none}.meta{position:relative;display:flex;flex-wrap:wrap;gap:8px}.pill{display:inline-flex;border:1px solid rgba(28,19,8,.18);background:rgba(255,255,255,.22);border-radius:999px;padding:6px 9px;color:#4b3520;font:900 10px var(--mono);text-transform:uppercase;letter-spacing:.1em}.pill.red{color:#651d17;border-color:rgba(159,47,37,.28);background:rgba(159,47,37,.08)}.scene{position:relative;margin-top:22px}.scene h2{margin:0;font:900 clamp(36px,7vw,78px)/.88 var(--serif);letter-spacing:-.06em;color:#1b1208}.story{margin:22px 0 0;color:#2a1d10;font:400 clamp(18px,2.7vw,25px)/1.44 var(--serif)}.prompt{margin:26px 0 0;border-left:5px solid var(--red);background:rgba(159,47,37,.08);padding:14px 16px;color:#26180d;font-weight:900;line-height:1.35}.move{position:absolute;left:28px;right:28px;bottom:24px;border:1px solid rgba(28,19,8,.18);background:rgba(255,255,255,.22);border-radius:18px;padding:13px 15px;color:#4b3520;opacity:0;transform:translateY(8px);transition:.22s ease}.move.show{opacity:1;transform:none}.move b{color:#651d17}.loading,.error{position:relative;margin-top:40px;padding:18px;border-radius:16px;border:1px dashed rgba(28,19,8,.24);background:rgba(255,255,255,.18);color:#3f2d1b;line-height:1.45}.error{border-color:rgba(159,47,37,.45);color:#651d17}
    .board{position:relative;min-height:680px;border:1px solid rgba(238,218,176,.18);border-radius:34px;background:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.24));box-shadow:var(--shadow);padding:16px;overflow:hidden}.board:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(241,199,106,.12),transparent 40%);pointer-events:none}.board-head{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.board h3{margin:0;font:900 30px var(--serif);letter-spacing:-.04em}.counter{color:var(--paper2);font:900 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.tabs{position:relative;display:flex;flex-direction:column;gap:9px;overflow:auto;max-height:600px;padding-right:2px}.tab{width:100%;text-align:left;border:1px solid rgba(238,218,176,.16);border-radius:14px;background:linear-gradient(90deg,rgba(238,218,176,.08),rgba(0,0,0,.2));padding:12px;box-shadow:0 10px 20px rgba(0,0,0,.2);transition:.16s ease}.tab:hover,.tab:focus-visible{outline:none;border-color:rgba(241,199,106,.58);transform:translateX(-2px)}.tab.open{background:linear-gradient(90deg,rgba(79,128,92,.22),rgba(0,0,0,.18));border-color:rgba(79,128,92,.74)}.tabtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.type,.value{font:900 9px var(--mono);letter-spacing:.11em;text-transform:uppercase}.type{color:var(--lamp)}.value{color:var(--paper2)}.tabtitle{font-weight:950;color:var(--paper);line-height:1.15}.tabtext{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.35}.finding{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(238,218,176,.12);color:var(--paper2);font-size:12px;line-height:1.38}.tab.open .finding{display:block}.sources{position:relative;display:none;margin-top:14px;border-top:1px solid rgba(238,218,176,.14);padding-top:12px;color:var(--muted);font-size:11px;line-height:1.45}.sources.show{display:block}.sources a{color:var(--paper2)}
    .dock{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));border:1px solid rgba(238,218,176,.22);border-radius:26px;background:rgba(7,5,3,.84);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.66);padding:12px}.dock-inner{width:min(1280px,100%);margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}.dock-title{font:900 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--paper2)}.actions{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow:auto}.action{border:1px solid rgba(238,218,176,.18);border-radius:18px;background:linear-gradient(180deg,rgba(238,218,176,.09),rgba(0,0,0,.26));padding:12px;text-align:left;min-height:74px}.action:hover,.action:focus-visible{outline:none;border-color:rgba(241,199,106,.65);background:rgba(241,199,106,.12)}.action b{display:block;font-weight:950;line-height:1.16}.action span{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mini{display:inline-flex;border:1px solid rgba(238,218,176,.14);border-radius:999px;padding:4px 7px;color:var(--paper2);font:900 9px var(--mono);text-transform:uppercase;letter-spacing:.08em}.pos{color:#93cc99}.neg{color:#e58677}
    .autopsy{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(0,0,0,.76);backdrop-filter:blur(14px);padding:20px}.autopsy.show{display:grid}.autopsy-card{width:min(850px,100%);border:1px solid rgba(159,47,37,.5);border-radius:32px;background:radial-gradient(circle at 50% 0%,rgba(159,47,37,.22),transparent 34%),linear-gradient(180deg,#18100a,#080604);box-shadow:var(--shadow);padding:clamp(22px,4vw,42px)}.profile{color:var(--lamp);font:900 11px var(--mono);letter-spacing:.16em;text-transform:uppercase}.autopsy h2{margin:12px 0 0;font:900 clamp(38px,8vw,82px)/.88 var(--serif);letter-spacing:-.06em}.scar{margin-top:18px;border-left:5px solid var(--red);background:rgba(159,47,37,.16);padding:16px;font:400 clamp(22px,4vw,34px)/1.18 var(--serif)}.autopsy ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}.autopsy li{border:1px solid rgba(238,218,176,.12);border-radius:14px;background:rgba(255,255,255,.04);padding:11px 12px;color:var(--paper2);line-height:1.4}.skillrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.autopsy-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.primary,.ghost{border:1px solid rgba(241,199,106,.52);border-radius:999px;background:rgba(241,199,106,.16);padding:11px 14px;font-weight:950}.ghost{background:transparent;border-color:rgba(238,218,176,.18);color:var(--paper2)}
    @media(max-width:960px){.app{padding-bottom:150px}.runtime{display:none}.desk{grid-template-columns:1fr}.stage{min-height:620px}.board{min-height:auto}.tabs{max-height:none}.photo,.string,.stamp{opacity:.45}.dock-inner{grid-template-columns:1fr}.actions{grid-auto-columns:minmax(230px,88vw)}.brand p{white-space:normal}.folder{top:51%;min-height:500px}.paper{margin-left:14px;margin-right:14px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="seal">SX</div><div><h1>SETTLED</h1><p>Interactive prediction-market case file · SETTLED-UI-002A</p></div></div><div id="runtime" class="runtime">Checking runtime</div></header>
    <section class="desk">
      <div class="stage"><div class="string s1"></div><div class="string s2"></div><div class="photo"></div><div class="stamp">CASE 01</div><article id="folder" class="folder"><div id="dossier" class="paper"><div class="loading">Opening the case file from <b>/api/settled</b>.</div></div><div id="movement" class="move"></div></article></div>
      <aside class="board"><div class="board-head"><h3>Evidence Tabs</h3><span id="count" class="counter">0 inspected</span></div><div id="tabs" class="tabs"><div class="loading">Evidence appears after the dossier opens.</div></div><div id="sources" class="sources"></div></aside>
    </section>
  </main>
  <nav class="dock"><div class="dock-inner"><div class="dock-title">Decision Actions</div><div id="actions" class="actions"><span class="mini">Loading choices</span></div></div></nav>
  <section id="autopsy" class="autopsy" role="dialog" aria-modal="true" aria-label="Behavioral autopsy"></section>
  <script>
    const API="/api/settled"; const state={health:null,chapter:null,attempt:null,node:null,inspected:new Set(),movement:null};
    const $=id=>document.getElementById(id); const safe=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    async function call(path,opt={}){const r=await fetch(API+path,{headers:{"content-type":"application/json",...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`Request failed: ${path}`);return d;}
    async function boot(){try{state.health=await call("/health");$("runtime").textContent=`${state.health.build} · ${state.health.validation?.ok?"VALID":"CHECK"}`;const c=await call("/chapters/chapter-01-the-suit");state.chapter=c.chapter;const s=await call("/attempts",{method:"POST",body:"{}"});state.attempt=s.attempt;state.node=s.node;render();}catch(e){$("runtime").textContent="OX CONNECTION FAILED";$("dossier").innerHTML=`<div class="error"><b>Case file failed to load.</b><br>${safe(e.message)}<br><br>Confirm /api/settled/validate returns ok:true.</div>`;$("actions").innerHTML=`<button class="action" onclick="location.reload()"><b>Retry connection</b><span><em class="mini">reload</em></span></button>`;}}
    function kind(){return state.node?.terminal?"Autopsy":(state.node?.kind==="evidence_room"?"Evidence Room":"Decision Freeze")}
    function render(){renderDossier();renderEvidence();renderActions();renderMovement();renderSources(false)}
    function renderDossier(){const n=state.node;if(!n)return;if(n.terminal){renderAutopsy(n);return}$("dossier").innerHTML=`<div class="meta"><span class="pill red">Case 01</span><span class="pill">${safe(kind())}</span><span class="pill">Score ${safe(state.attempt?.score_total??0)}</span></div><section class="scene"><h2>${safe(n.title)}</h2><p class="story">${safe(n.story)}</p><div class="prompt">${safe(n.prompt||"Choose the next case action.")}</div></section>`}
    function renderMovement(){const b=$("movement");if(!state.movement){b.className="move";b.innerHTML="";return}b.className="move show";b.innerHTML=`<b>${safe(state.movement.title||"Case movement")}</b><br>${safe(state.movement.detail||"")}`}
    function renderEvidence(){const cards=state.node?.evidence_cards||[];$("count").textContent=`${state.inspected.size} inspected`;if(!cards.length){$("tabs").innerHTML=`<div class="loading">No active evidence in this scene.</div>`;return}$("tabs").innerHTML=cards.map(card=>{const key=`${state.node.id}:${card.id}`,open=state.inspected.has(key);return `<button type="button" class="tab ${open?"open":""}" data-ev="${safe(card.id)}"><div class="tabtop"><span class="type">${safe(card.type)}</span><span class="value">${safe(card.inspection_value)}</span></div><div class="tabtitle">${safe(card.label)}</div><div class="tabtext">${safe(card.display)}</div><div class="finding"><b>Finding:</b> ${safe(card.finding)}<br><br><b>Why it matters:</b> ${safe(card.why_it_matters)}</div></button>`}).join("");document.querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",()=>inspect(b.dataset.ev)))}
    function renderActions(){const choices=state.node?.choices||[];if(state.node?.terminal){$("actions").innerHTML=`<button class="action" onclick="location.reload()"><b>Open fresh case file</b><span><em class="mini">replay</em></span></button><button class="action" id="showSources"><b>Open source appendix</b><span><em class="mini">verify</em></span></button>`;setTimeout(()=>document.getElementById("showSources")?.addEventListener("click",()=>renderSources(true)),0);return}if(!choices.length){$("actions").innerHTML=`<span class="mini">No actions available</span>`;return}$("actions").innerHTML=choices.map(ch=>{const pos=Number(ch.score)>=0,tags=(ch.tags||[]).slice(0,2).map(t=>`<em class="mini">${safe(t)}</em>`).join("");return `<button type="button" class="action" data-choice="${safe(ch.id)}"><b>${safe(ch.label)}</b><span><em class="mini ${pos?"pos":"neg"}">${pos?"+":""}${safe(ch.score)}</em>${tags}</span></button>`}).join("");document.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.choice)))}
    async function inspect(id){if(!state.attempt||!state.node)return;const key=`${state.node.id}:${id}`;if(state.inspected.has(key))return;try{await call(`/attempts/${state.attempt.attempt_id}/evidence`,{method:"POST",body:JSON.stringify({node_id:state.node.id,evidence_id:id})});state.inspected.add(key);renderEvidence();}catch(e){$("runtime").textContent="EVIDENCE ERROR"}}
    async function choose(id){if(!state.attempt||!state.node)return;const f=$("folder");f.classList.add("shift");try{const r=await call(`/attempts/${state.attempt.attempt_id}/choice`,{method:"POST",body:JSON.stringify({node_id:state.node.id,choice_id:id})});state.attempt=r.attempt;state.node=r.node;state.movement=r.transition;setTimeout(()=>{f.classList.remove("shift");render();window.scrollTo({top:0,behavior:"smooth"})},150)}catch(e){f.classList.remove("shift");$("runtime").textContent="CHOICE ERROR"}}
    function renderAutopsy(n){renderEvidence();const o=n.outcome||{},lines=(o.autopsy||n.autopsy||[]).map(x=>`<li>${safe(x)}</li>`).join(""),skills=(o.skill_report||[]).slice(0,7).map(s=>`<span class="mini ${Number(s.score)>=0?"pos":"neg"}">${safe(s.label)} ${Number(s.score)>=0?"+":""}${safe(s.score)}</span>`).join("");$("autopsy").className="autopsy show";$("autopsy").innerHTML=`<div class="autopsy-card"><div class="profile">Profile unlocked · ${safe(n.profile)}</div><h2>Behavioral Autopsy</h2><div class="scar">${safe(n.scar)}</div><ul>${lines}</ul><div class="skillrow">${skills}</div><div class="autopsy-actions"><button class="primary" onclick="location.reload()">Replay the case</button><button class="ghost" id="closeAutopsy">Return to desk</button><button class="ghost" id="sourcesBtn">Source appendix</button></div></div>`;document.getElementById("closeAutopsy")?.addEventListener("click",()=>$("autopsy").className="autopsy");document.getElementById("sourcesBtn")?.addEventListener("click",()=>{$("autopsy").className="autopsy";renderSources(true)});$("dossier").innerHTML=`<div class="meta"><span class="pill red">Case Closed</span><span class="pill">${safe(n.profile)}</span><span class="pill">Score ${safe(state.attempt?.score_total??0)}</span></div><section class="scene"><h2>${safe(n.profile)}</h2><p class="story">${safe(n.result)}</p><div class="prompt">${safe(n.diagnosis)}</div></section>`;renderActions()}
    function renderSources(show){const box=$("sources");if(!show){box.className="sources";box.innerHTML="";return}const src=state.chapter?.sources||[];box.className="sources show";box.innerHTML=`<div class="counter">Source Appendix</div>`+src.map(s=>`<p><a href="${safe(s.url)}" target="_blank" rel="noreferrer">${safe(s.publisher)} — ${safe(s.title)}</a></p>`).join("")}
    boot();
  </script>
</body>
</html>
