<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Odds X-Ray · The Ox</title>
<style>
:root{color-scheme:dark;--bg:#050609;--panel:#11141c;--line:rgba(255,255,255,.14);--text:#f6f0db;--muted:rgba(246,240,219,.66);--faint:rgba(246,240,219,.42);--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(240,51,47,.18),transparent 30%),radial-gradient(circle at 95% 3%,rgba(52,130,255,.16),transparent 31%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1160px,calc(100% - 28px));margin:0 auto;padding:18px 0 max(34px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#fff6ce 0 48%,var(--red) 49%);color:#080808;display:grid;place-items:center;font-weight:950;box-shadow:10px 10px 0 rgba(52,130,255,.17)}.brand b,.brand em{display:block}.brand em{font-style:normal;color:var(--muted);font-size:13px}.nav{display:flex;gap:8px}.nav a,.btn{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.04);font-weight:850}.primary{background:var(--yellow);color:#080808}.panel{border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025)),rgba(17,20,28,.92);box-shadow:0 28px 90px rgba(0,0,0,.54);padding:clamp(22px,5vw,52px);margin-bottom:16px}.stripe{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;color:var(--yellow);font-weight:950;font-size:12px}h1{font-size:clamp(42px,8vw,84px);line-height:.9;letter-spacing:-.065em;margin:8px 0 18px}.lede,.copy{color:var(--muted);line-height:1.45}.lede{font-size:clamp(18px,2.7vw,29px);max-width:900px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.card,.choice,.feed,.actionsBox,.evidenceBox,.trailBox{border:1px solid var(--line);border-radius:22px;background:rgba(0,0,0,.24);padding:18px}.card small,.sectionTitle{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-size:11px;font-weight:900}.card strong{display:block;font-size:24px;margin:8px 0}.scar{display:inline-block;margin-top:12px;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:13px 15px;color:#fff6ce;font-weight:900}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.row{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,0,0,.22)}footer{display:flex;justify-content:space-between;color:rgba(246,240,219,.42);font-size:13px;padding:12px 4px}.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);gap:14px}.market,.side{border:1px solid var(--line);border-radius:26px;background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(8,10,15,.78);box-shadow:0 18px 52px rgba(0,0,0,.3)}.market{overflow:hidden}.ticker{display:flex;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}.metric{padding:14px;flex:1}.metric small,.tab small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;margin:0 0 8px}.metric b{display:block;font-size:clamp(24px,7vw,42px);letter-spacing:-.05em}.cash b{color:var(--green)}.cash.warn b{color:var(--yellow)}.cash.danger b{color:var(--red)}.chart{height:220px;padding:14px}.chart svg{width:100%;height:100%;display:block}.gridline{stroke:rgba(255,255,255,.08)}.line{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round}.line.warn{stroke:var(--yellow)}.line.danger{stroke:var(--red)}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;border-top:1px solid var(--line)}.tab{min-height:78px;border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(0,0,0,.22)}.hot{border-color:rgba(255,223,89,.42)}.side{padding:18px}.scene small{color:var(--yellow);text-transform:uppercase;letter-spacing:.16em;font-weight:950;font-size:11px}.scene h2{font-size:clamp(30px,7vw,46px);line-height:.95;letter-spacing:-.045em;margin:8px 0 12px}.scene p{font-size:17px;line-height:1.45;color:var(--muted);margin:0}.feed,.actionsBox,.evidenceBox,.trailBox{margin-top:14px}.feedline{display:flex;gap:9px;border-top:1px solid rgba(255,255,255,.08);padding:10px 0;color:var(--muted);font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:0 0 auto}.dot.warn{background:var(--yellow)}.dot.danger{background:var(--red)}.evidenceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-top:10px}.eCard{border:1px solid rgba(255,255,255,.11);border-radius:16px;background:rgba(255,255,255,.035);padding:12px}.eCard b{display:block;margin:5px 0 7px}.eCard p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}.eCard .basis{margin-top:8px;color:#fff6ce;font-size:12px}.choice{width:100%;color:var(--text);cursor:pointer;margin:0 0 10px;min-height:58px}.choice:hover{border-color:rgba(255,223,89,.7);background:rgba(255,223,89,.08)}.choice strong{display:block;font-size:17px;line-height:1.2}.choice small{display:block;color:var(--faint);margin-top:7px}.between{display:grid;place-items:center;min-height:58vh;text-align:center}.pulse{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,223,89,.35);background:radial-gradient(circle,rgba(255,223,89,.25),rgba(255,223,89,.02));animation:pulse 1s infinite alternate;margin:0 auto 20px}@keyframes pulse{from{transform:scale(.95);opacity:.75}to{transform:scale(1.05);opacity:1}}.result{border-left:7px solid var(--red);padding-left:18px}.autopsy{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:20px}@media(max-width:860px){.shell{width:100%;padding:10px 8px max(18px,env(safe-area-inset-bottom))}.top{margin-bottom:10px}.nav{display:none}.brand em{display:none}.mark{width:40px;height:40px}.cockpit{display:flex;flex-direction:column;gap:10px}.market{border-radius:20px}.ticker{position:sticky;top:0;z-index:2}.metric{padding:8px}.metric small{font-size:9px}.metric b{font-size:25px}.chart{height:92px;padding:6px 8px}.line{stroke-width:4}.tabs{grid-template-columns:repeat(4,1fr);gap:5px;padding:7px}.tab{min-height:44px;padding:6px;border-radius:12px}.tab small{font-size:7px;letter-spacing:.07em;margin-bottom:2px}.tab b{font-size:11px;line-height:1.1}.side{padding:14px;border-radius:20px}.scene h2{font-size:30px;margin-bottom:8px}.scene p{font-size:15px;line-height:1.34}.feed,.evidenceBox{margin-top:10px;padding:10px;border-radius:18px}.feedline{font-size:12px;padding:6px 0}.feedline:nth-of-type(n+3){display:none}.evidenceGrid{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px}.eCard{min-width:210px}.actionsBox{position:sticky;bottom:env(safe-area-inset-bottom);z-index:5;margin-top:10px;border-radius:20px;background:rgba(12,14,20,.96);backdrop-filter:blur(14px);box-shadow:0 -16px 36px rgba(0,0,0,.38);padding:10px}.choice{min-height:48px;padding:12px 14px;border-radius:16px;margin-bottom:8px}.choice strong{font-size:15px}.choice small{display:none}.autopsy{display:block}.hideMobile{display:none}.grid{grid-template-columns:1fr}h1{font-size:46px}.lede{font-size:19px}}</style>
</head>
<body><main class="shell"><header class="top"><a class="brand" href="/"><span class="mark">OX</span><span><b>Odds X-Ray</b><em>The Ox</em></span></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a></nav></header><div id="app"></div><footer><b>OX-009A</b><span class="hideMobile">Evidence casefile renderer.</span></footer></main>
<script>
const app=document.getElementById('app'),path=location.pathname.replace(/\/$/,'')||'/';
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const page=h=>{app.innerHTML=h;scrollTo({top:0,behavior:'smooth'})};
const shell=(e,t,l,b='')=>`<section class="panel"><div class="stripe"></div><p class="eyebrow">${esc(e)}</p><h1>${esc(t)}</h1><p class="lede">${esc(l)}</p>${b}</section>`;
async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.forge?.error||d.error||'Request failed');return d}
function home(){page(shell('Evidence casefile renderer','Second Stake now exposes the investigation layer.','The player sees not only the market cockpit, but also the evidence objects that explain why each decision is correct or dangerous.','<div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window">Play The $180 Window</a><a class="btn" href="/app/second-stake">Open Second Stake</a></div><div class="grid"><div class="card"><small>Build</small><strong>OX-009A</strong><p class="copy">Renders evidence objects from FORGE-006A.</p></div><div class="card"><small>Player loop</small><strong>Inspect → Decide → Autopsy</strong><p class="copy">Rules, source, book, social noise, clock, and cash-out logic are visible.</p></div></div>'))}
function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is Product 001.','<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">Controlled first-loss simulations for new prediction-market players.</p></a></div>'))}
async function secondStake(){page(shell('Product 001','Loading Second Stake','Reading the Forge scenario catalog.'));try{const d=await api('/api/forge/scenarios'),s=d.forge?.scenarios||[],cards=s.map(x=>`<a class="card" href="${x.status==='locked'?'#':'/app/second-stake/scenarios/'+encodeURIComponent(x.id)}"><small>${x.status==='locked'?'Locked case':'Playable case'} · ${esc(x.format||'')}</small><strong>${esc(x.title)}</strong><p class="copy">${esc(x.subtitle||x.scar||'')}</p>${x.status==='locked'?'<p class="copy">Locked until Scenario 01 proves the format.</p>':'<p class="scar">Start case</p>'}</a>`).join('');page(shell('Product 001','Second Stake','A first-loss simulator with cockpit state, evidence, and behavioral autopsy.',`<div class="grid">${cards}</div><div class="actions"><a class="btn" href="/app/history">View attempts</a></div>`))}catch(e){page(shell('Second Stake unavailable','The Forge did not return the catalog.',String(e.message||e)))}}
async function history(){page(shell('History','Loading attempt history','The Ox is asking The Forge for recorded decisions.'));try{const [a,p]=await Promise.all([api('/api/forge/attempts'),api('/api/forge/progress')]),rows=(a.forge?.attempts||[]).map(x=>`<div class="row"><b>${esc(x.scenario_title||x.scenario_id)}</b><p class="copy">${esc(x.status)} · ${esc(x.choices_count)} moves · ${esc(x.profile||'unfinished')}</p>${x.scar_unlocked?`<p class="scar">${esc(x.scar_unlocked)}</p>`:''}</div>`).join('')||'<p class="copy">No attempts recorded yet.</p>',q=p.forge?.progress||{};page(shell('Attempt history','The Forge is remembering.','Every completed run becomes a saved behavioral autopsy.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${q.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${q.completed_attempts||0}</strong></div></div><div>${rows}</div><div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window">Run The $180 Window</a></div>`))}catch(e){page(shell('History unavailable','The Forge did not return history.',String(e.message||e)))}}
function scenarioId(){const p='/app/second-stake/scenarios/';return decodeURIComponent(path.startsWith(p)?path.slice(p.length):'s01-the-180-window')}
function legacyScreen(node){const id=node?.id||'start';const map={start:[171,'$100','8:00','Buried','Pending','Thin','Rising','up',['Cash-out is green but not guaranteed.','You already put $100 into the market.','The official trigger is still unresolved.']],rules_tab:[169,'$100','7:00','Read','Pending','Thin','Medium','flat',['Rules say only the official source counts.','Cash-out may disappear during volatility.']],small_entry:[62,'$40','6:00','Read','Pending','Thin','Low','flat',['Cash-out shows $62 on $40.','Small size keeps the room quiet.']],controlled_entry:[76,'$50','6:00','Read','Checked','Thin','Low','flat',['Position is small enough to think.','The official update is still pending.']],buy_blind:[180,'$200','5:00','Skipped','Pending','Thin','High','up',['Cash-out touches $180.','The position got heavier before the read got clearer.']],buy_overconfident:[183,'$100','5:40','Skipped','Pending','Thin','Rising','up',['Cash-out touches $183.','No official confirmation has arrived.']],liquidity_check:[146,'$100','4:30','Unclear','Pending','Checked','High','warn',['Full exit would slip.','Displayed price is not the same as money out.']],resolver_source:[169,'Watch','6:30','Read','Checked','Thin','Low','flat',['Official source has not confirmed the trigger.','No position means no rescue decision.']],cashout_slips:[146,'$100','3:00','Unclear','Pending','Thin','High','warn',['The $180 window is gone.','Current exit is still real but worse.']],late_rules:[132,'$100','3:40','Read late','Pending','Thin','High','warn',['The contract is narrower than the headline.','The market is starting to notice.']],add_on_green:[183,'$200','5:00','Unclear','Pending','Very thin','High','up',['The number is bigger, but the exit is thinner.','Size has outrun the original idea.']],rumor_spiral:[114,'$100','4:20','Unclear','Pending','Thin','Rising','flat',['The thread gives confidence without control.','Nobody links the official source.']],official_pressure:[68,'$100','2:30','Read','Updated','Thin','High','down',['The official source weakens the trade.','The exit is smaller but still real.']],stall_two:[51,'$100','1:30','Unclear','Updated','Thin','High','down',['The bounce never comes.','You are negotiating with regret.']],revenge_add:[39,'$300','0:45','Too late','Updated','Broken','Critical','down',['The trade is now about regret.','Size is doing the job of hope.']]};const e=map[id]||map.start;return{cashout:e[0],position:e[1],timer:e[2],rules:e[3],source:e[4],book:e[5],risk:e[6],chart:e[7],feed:e[8]}}
function screen(node){const s=node?.screen||legacyScreen(node);let cash=Number(s.cashout||0),cls=cash<=75?'danger':cash<=150?'warn':'';return{cash,cls,position:s.position||'Watch',timer:s.timer||'--',rules:s.rules||'Unknown',source:s.source||'Pending',book:s.book||'Thin',risk:s.risk||'Unknown',chart:s.chart||'flat',feed:Array.isArray(s.feed)?s.feed:[]}}
function chart(v){const p=v.chart==='up'?'M8 150 C50 124 74 138 112 90 C150 42 190 70 238 28 C292 -12 324 60 360 40':v.chart==='down'?'M8 44 C52 60 82 34 120 72 C156 112 200 90 238 130 C274 168 316 132 360 180':v.chart==='warn'?'M8 84 C48 78 92 64 132 78 C174 92 206 82 244 102 C284 122 322 108 360 126':'M8 96 C52 90 90 102 132 94 C178 86 210 104 252 94 C294 84 326 100 360 92';return`<svg viewBox="0 0 368 190" preserveAspectRatio="none"><line class="gridline" x1="0" y1="45" x2="368" y2="45"/><line class="gridline" x1="0" y1="95" x2="368" y2="95"/><line class="gridline" x1="0" y1="145" x2="368" y2="145"/><rect x="28" y="116" width="18" height="44" fill="rgba(37,211,102,.45)"/><rect x="76" y="92" width="18" height="52" fill="rgba(37,211,102,.55)"/><rect x="124" y="62" width="18" height="70" fill="rgba(37,211,102,.72)"/><rect x="172" y="40" width="18" height="84" fill="rgba(255,223,89,.65)"/><rect x="220" y="60" width="18" height="72" fill="rgba(240,51,47,.62)"/><rect x="268" y="94" width="18" height="64" fill="rgba(240,51,47,.72)"/><path class="line ${v.cls}" d="${p}"/></svg>`}
function evidence(node){const ev=Array.isArray(node.evidence)?node.evidence:[];if(!ev.length)return '';return`<div class="evidenceBox"><span class="sectionTitle">Evidence board</span><div class="evidenceGrid">${ev.map(e=>`<div class="eCard"><span class="sectionTitle">${esc(e.type||e.status||'evidence')}</span><b>${esc(e.label)}</b><p>${esc(e.display||'')}</p>${e.basis?`<p class="basis">${esc(e.basis)}</p>`:''}${e.teaches?`<p>${esc(e.teaches)}</p>`:''}</div>`).join('')}</div></div>`}
function choiceBasis(c){const b=Array.isArray(c.basis)?c.basis:[];return b[0]?`<small>${esc(b[0])}</small>`:''}
function cockpit(n,a,s){const v=screen(n),cash=v.position==='No trade'?'—':'$'+v.cash;return`<section class="cockpit"><div class="market"><div class="ticker"><div class="metric cash ${v.cls}"><small>Cash-out</small><b>${cash}</b></div><div class="metric"><small>Position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Timer</small><b>${esc(v.timer)}</b></div></div><div class="chart">${chart(v)}</div><div class="tabs"><div class="tab ${v.rules==='Buried'?'hot':''}"><small>Rules</small><b>${esc(v.rules)}</b></div><div class="tab ${v.source==='Pending'?'hot':''}"><small>Source</small><b>${esc(v.source)}</b></div><div class="tab"><small>Book</small><b>${esc(v.book)}</b></div><div class="tab"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><div class="side"><div class="scene"><small>Move ${(a.choices?.length||0)+1} · ${esc(s.title)}</small><h2>${esc(n.scene||s.title)}</h2><p>${esc(n.copy||n.prompt||'')}</p></div>${evidence(n)}<div class="feed"><span class="sectionTitle">Live feed</span>${v.feed.map((x,i)=>`<div class="feedline"><span class="dot ${i===0?v.cls:''}"></span><span>${esc(x)}</span></div>`).join('')}</div><div class="actionsBox"><span class="sectionTitle">Available actions</span>${(n.choices||[]).map(c=>`<button class="choice" data-choice="${esc(c.id)}"><strong>${esc(c.label)}</strong>${choiceBasis(c)}</button>`).join('')}</div></div></section>`}
function trail(a){const items=(a.choices||[]).map(c=>`<div class="row"><b>${esc(c.label)}</b>${(c.basis||[]).slice(0,2).map(x=>`<p class="copy">${esc(x)}</p>`).join('')}</div>`).join('');return items?`<div class="trailBox"><span class="sectionTitle">Decision trail</span>${items}</div>`:''}
async function scenario(){const sid=scenarioId();page('<div class="between"><div><div class="pulse"></div><p class="eyebrow">Opening case</p><h1>The market loads.</h1></div></div>');try{const s0=await api('/api/forge/attempts',{method:'POST',body:JSON.stringify({scenario_id:sid})});let a=s0.forge?.attempt,s=s0.forge?.scenario_summary,n=s0.forge?.node;if(!a||!n)throw new Error('Attempt did not start correctly');const render=node=>{if(node.choices){page(cockpit(node,a,s));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{const label=b.textContent;b.disabled=true;page(`<div class="between"><div><div class="pulse"></div><p class="eyebrow">The market moves</p><h1>${esc(label)}</h1></div></div>`);try{const out=await api(`/api/forge/attempts/${a.attempt_id}/choice`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});a=out.forge?.attempt||a;render(out.forge?.node)}catch(e){page(shell('Action failed','The move did not save.',String(e.message||e)))}})}else{const o=node.outcome||a.outcome||{},v=screen(node),mist=(o.top_mistakes||[]).map(m=>`<div class="row"><b>${esc(m.tag.replaceAll('_',' '))}</b></div>`).join('')||'<p class="copy">No major mistake tags recorded.</p>',str=(o.strengths||[]).map(x=>`<div class="row"><b>${esc(x)}</b></div>`).join('')||'<p class="copy">No strength notes recorded.</p>';page(shell('Case autopsy',o.profile||node.profile||s.title,node.result||o.result||'Case complete.',`<div class="market" style="margin:18px 0"><div class="ticker"><div class="metric cash ${v.cls}"><small>Final cash-out</small><b>${v.position==='No trade'?'—':'$'+v.cash}</b></div><div class="metric"><small>Final position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><div class="result"><p class="copy"><b>Diagnosis:</b> ${esc(node.diagnosis||o.diagnosis||'No diagnosis supplied.')}</p><p class="scar">${esc(node.scar||o.scar||a.scar_unlocked||s.scar)}</p></div><div class="grid"><div class="card"><small>Profile</small><strong>${esc(o.profile||node.profile||'Complete')}</strong></div><div class="card"><small>Score</small><strong>${esc(o.score_total??a.score_total??0)}</strong></div><div class="card"><small>Moves</small><strong>${esc(a.choices?.length||0)}</strong></div></div><div class="autopsy"><div><h2>What got you</h2>${mist}</div><div><h2>What worked</h2>${str}</div></div>${trail(a)}<div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/${encodeURIComponent(sid)}">Run it again</a><a class="btn" href="/app/history">View history</a><a class="btn" href="/app/second-stake">Back</a></div>`))}};render(n)}catch(e){page(shell('Case failed to load','The scenario did not start.',String(e.message||e)))}}
function route(){if(path==='/')return home();if(path==='/app')return home();if(path==='/app/products')return products();if(path==='/app/second-stake')return secondStake();if(path==='/app/history')return history();if(path.startsWith('/app/second-stake/scenarios/'))return scenario();return home()}route();
</script></body></html>
