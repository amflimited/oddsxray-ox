<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Odds X-Ray · The Ox</title><style>:root{color-scheme:dark;--bg:#050609;--line:rgba(255,255,255,.13);--text:#f6f0db;--muted:rgba(246,240,219,.66);--faint:rgba(246,240,219,.42);--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(240,51,47,.18),transparent 30%),radial-gradient(circle at 95% 3%,rgba(52,130,255,.16),transparent 31%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1160px,calc(100% - 28px));margin:0 auto;padding:18px 0 max(34px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#fff6ce 0 48%,var(--red) 49%);color:#080808;display:grid;place-items:center;font-weight:950;box-shadow:10px 10px 0 rgba(52,130,255,.17)}.brand b,.brand em{display:block}.brand em{font-style:normal;color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.04);font-weight:850}.primary{background:var(--yellow);color:#080808}.panel{overflow:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025)),rgba(17,20,28,.92);box-shadow:0 28px 90px rgba(0,0,0,.54);padding:clamp(22px,5vw,52px);margin-bottom:16px}.stripe{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.20em;color:var(--yellow);font-weight:950;font-size:12px}h1{font-size:clamp(42px,8vw,84px);line-height:.9;letter-spacing:-.065em;margin:8px 0 18px}.lede{font-size:clamp(18px,2.7vw,29px);line-height:1.25;color:var(--muted);max-width:900px}.copy{font-size:17px;line-height:1.55;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.card,.choice,.feed,.actionsBox{border:1px solid var(--line);border-radius:22px;background:rgba(0,0,0,.24);padding:18px}.card small{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:900}.card strong{display:block;font-size:24px;margin:8px 0}.scar{display:inline-block;margin-top:12px;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:13px 15px;color:#fff6ce;font-weight:900}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.row{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,0,0,.22)}footer{display:flex;justify-content:space-between;color:rgba(246,240,219,.42);font-size:13px;padding:12px 4px}.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:14px}.market,.side{border:1px solid var(--line);border-radius:26px;background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(8,10,15,.78);box-shadow:0 18px 52px rgba(0,0,0,.30)}.market{overflow:hidden}.ticker{display:flex;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}.metric{padding:14px;flex:1}.metric small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.metric b{display:block;font-size:clamp(24px,7vw,42px);letter-spacing:-.05em;margin-top:3px}.cash b{color:var(--green)}.cash.warn b{color:var(--yellow)}.cash.danger b{color:var(--red)}.chart{height:220px;padding:14px}.chart svg{width:100%;height:100%;display:block}.gridline{stroke:rgba(255,255,255,.08)}.line{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(37,211,102,.3))}.line.warn{stroke:var(--yellow)}.line.danger{stroke:var(--red)}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;border-top:1px solid var(--line)}.tab{min-height:78px;border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(0,0,0,.22)}.tab small,.feed h3,.actionsBox h3{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;margin:0 0 8px}.tab b{display:block}.hot{border-color:rgba(255,223,89,.42)}.side{padding:18px}.scene small{color:var(--yellow);text-transform:uppercase;letter-spacing:.16em;font-weight:950;font-size:11px}.scene h2{font-size:clamp(30px,7vw,46px);line-height:.95;letter-spacing:-.045em;margin:8px 0 12px}.scene p{font-size:17px;line-height:1.45;color:var(--muted);margin:0}.feed,.actionsBox{margin-top:14px}.feedline{display:flex;gap:9px;border-top:1px solid rgba(255,255,255,.08);padding:10px 0;color:var(--muted);font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:0 0 auto}.dot.warn{background:var(--yellow)}.dot.danger{background:var(--red)}.choice{width:100%;color:var(--text);cursor:pointer;margin:0 0 10px;min-height:58px}.choice:active{transform:scale(.99)}.choice:hover{border-color:rgba(255,223,89,.7);background:rgba(255,223,89,.08)}.choice strong{display:block;font-size:17px;line-height:1.2}.between{display:grid;place-items:center;min-height:58vh;text-align:center}.pulse{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,223,89,.35);background:radial-gradient(circle,rgba(255,223,89,.25),rgba(255,223,89,.02));animation:pulse 1s infinite alternate;margin:0 auto 20px}@keyframes pulse{from{transform:scale(.95);opacity:.75}to{transform:scale(1.05);opacity:1}}.result{border-left:7px solid var(--red);padding-left:18px}.autopsy{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:20px}@media(max-width:860px){.shell{width:100%;padding:10px 8px max(18px,env(safe-area-inset-bottom))}.top{margin-bottom:10px;padding:0 2px}.nav{display:none}.brand em{display:none}.mark{width:40px;height:40px;border-radius:12px}.panel{border-radius:22px;padding:18px}.cockpit{display:flex;flex-direction:column;gap:10px}.market{border-radius:20px}.ticker{position:sticky;top:0;z-index:2}.metric{padding:8px 8px}.metric small{font-size:9px;letter-spacing:.10em}.metric b{font-size:25px}.chart{height:92px;padding:6px 8px}.line{stroke-width:4}.tabs{grid-template-columns:repeat(4,1fr);gap:5px;padding:7px}.tab{min-height:44px;padding:6px;border-radius:12px}.tab small{font-size:7px;letter-spacing:.07em;margin-bottom:2px}.tab b{font-size:11px;line-height:1.1}.side{margin-top:0;padding:14px;border-radius:20px}.scene h2{font-size:30px;margin-bottom:8px}.scene p{font-size:15px;line-height:1.34}.feed{margin-top:10px;padding:10px;border-radius:18px}.feed h3,.actionsBox h3{font-size:10px;letter-spacing:.10em}.feedline{font-size:12px;padding:6px 0}.feedline:nth-of-type(n+3){display:none}.actionsBox{position:sticky;bottom:env(safe-area-inset-bottom);z-index:5;margin-top:10px;border-radius:20px;background:rgba(12,14,20,.96);backdrop-filter:blur(14px);box-shadow:0 -16px 36px rgba(0,0,0,.38);padding:10px}.choice{min-height:48px;padding:12px 14px;border-radius:16px;margin-bottom:8px}.choice strong{font-size:15px}.autopsy{display:block}.hideMobile{display:none}.grid{grid-template-columns:1fr}h1{font-size:46px}.lede{font-size:19px}}</style></head><body><main class="shell"><header class="top"><a class="brand" href="/"><span class="mark">OX</span><span><b>Odds X-Ray</b><em>The Ox</em></span></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a></nav></header><div id="app"></div><footer><b>OX-008A</b><span class="hideMobile">Screen-state cockpit.</span></footer></main><script>const app=document.getElementById('app'),path=location.pathname.replace(/\/$/,'')||'/';const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const page=h=>{app.innerHTML=h;scrollTo({top:0,behavior:'smooth'})};const shell=(e,t,l,b='')=>`<section class="panel"><div class="stripe"></div><p class="eyebrow">${esc(e)}</p><h1>${esc(t)}</h1><p class="lede">${esc(l)}</p>${b}</section>`;async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.forge?.error||d.error||'Request failed');return d}function home(){page(shell('Screen-state cockpit','Second Stake is being rebuilt as one unified simulation.','The story and the market screen now come from the same Forge scene packet, so the text and visual state cannot drift apart.','<div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window">Play The $180 Window</a><a class="btn" href="/app/second-stake">Open Second Stake</a></div><div class="grid"><div class="card"><small>Build</small><strong>OX-008A</strong><p class="copy">Uses Forge screen state as source of truth.</p></div><div class="card"><small>Format</small><strong>One scene packet</strong><p class="copy">Narrative, cash-out, source, feed, risk, and choices are bundled together.</p></div></div>'))}function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is Product 001.','<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">Controlled first-loss simulations for new prediction-market players.</p></a></div>'))}async function secondStake(){page(shell('Product 001','Loading Second Stake','Reading the Forge scenario catalog.'));try{const d=await api('/api/forge/scenarios'),s=d.forge?.scenarios||[],cards=s.map(x=>`<a class="card" href="${x.status==='locked'?'#':'/app/second-stake/scenarios/'+encodeURIComponent(x.id)}"><small>${x.status==='locked'?'Locked case':'Playable case'}</small><strong>${esc(x.title)}</strong><p class="copy">${esc(x.subtitle||x.scar||'')}</p>${x.status==='locked'?'<p class="quiet">Locked until Scenario 01 proves the format.</p>':'<p class="scar">Start case</p>'}</a>`).join('');page(shell('Product 001','Second Stake','A first-loss simulator. Scenario 01 now uses unified screen-state scenes.',`<div class="grid">${cards}</div><div class="actions"><a class="btn" href="/app/history">View attempts</a></div>`))}catch(e){page(shell('Second Stake unavailable','The Forge did not return the catalog.',String(e.message||e)))}}async function history(){page(shell('History','Loading attempt history','The Ox is asking The Forge for recorded decisions.'));try{const [a,p]=await Promise.all([api('/api/forge/attempts'),api('/api/forge/progress')]),rows=(a.forge?.attempts||[]).map(x=>`<div class="row"><b>${esc(x.scenario_title||x.scenario_id)}</b><p class="copy">${esc(x.status)} · ${esc(x.choices_count)} moves · ${esc(x.profile||'unfinished')}</p>${x.scar_unlocked?`<p class="scar">${esc(x.scar_unlocked)}</p>`:''}</div>`).join('')||'<p class="copy">No attempts recorded yet.</p>',q=p.forge?.progress||{};page(shell('Attempt history','The Forge is remembering.','Every completed run becomes a saved behavioral autopsy.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${q.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${q.completed_attempts||0}</strong></div></div><div class="history">${rows}</div><div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window">Run The $180 Window</a></div>`))}catch(e){page(shell('History unavailable','The Forge did not return history.',String(e.message||e)))}}function scenarioId(){const p='/app/second-stake/scenarios/';return decodeURIComponent(path.startsWith(p)?path.slice(p.length):'s01-the-180-window')}function screen(node){const s=node?.screen||{};let cash=Number(s.cashout||0),cls=cash<=75?'danger':cash<=150?'warn':'';return{cash,cls,position:s.position||'Watch',timer:s.timer||'--',rules:s.rules||'Unknown',source:s.source||'Pending',book:s.book||'Thin',risk:s.risk||'Unknown',chart:s.chart||'flat',feed:Array.isArray(s.feed)?s.feed:[]}}function chart(v){const p=v.chart==='up'?'M8 150 C50 124 74 138 112 90 C150 42 190 70 238 28 C292 -12 324 60 360 40':v.chart==='down'?'M8 44 C52 60 82 34 120 72 C156 112 200 90 238 130 C274 168 316 132 360 180':v.chart==='warn'?'M8 84 C48 78 92 64 132 78 C174 92 206 82 244 102 C284 122 322 108 360 126':'M8 96 C52 90 90 102 132 94 C178 86 210 104 252 94 C294 84 326 100 360 92';return`<svg viewBox="0 0 368 190" preserveAspectRatio="none"><line class="gridline" x1="0" y1="45" x2="368" y2="45"/><line class="gridline" x1="0" y1="95" x2="368" y2="95"/><line class="gridline" x1="0" y1="145" x2="368" y2="145"/><rect x="28" y="116" width="18" height="44" fill="rgba(37,211,102,.45)"/><rect x="76" y="92" width="18" height="52" fill="rgba(37,211,102,.55)"/><rect x="124" y="62" width="18" height="70" fill="rgba(37,211,102,.72)"/><rect x="172" y="40" width="18" height="84" fill="rgba(255,223,89,.65)"/><rect x="220" y="60" width="18" height="72" fill="rgba(240,51,47,.62)"/><rect x="268" y="94" width="18" height="64" fill="rgba(240,51,47,.72)"/><path class="line ${v.cls}" d="${p}"/></svg>`}function cockpit(n,a,s){const v=screen(n),cash=v.position==='No trade'?'—':'$'+v.cash;return`<section class="cockpit"><div class="market"><div class="ticker"><div class="metric cash ${v.cls}"><small>Cash-out</small><b>${cash}</b></div><div class="metric"><small>Position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Timer</small><b>${esc(v.timer)}</b></div></div><div class="chart">${chart(v)}</div><div class="tabs"><div class="tab ${v.rules==='Buried'?'hot':''}"><small>Rules</small><b>${esc(v.rules)}</b></div><div class="tab ${v.source==='Pending'?'hot':''}"><small>Source</small><b>${esc(v.source)}</b></div><div class="tab"><small>Book</small><b>${esc(v.book)}</b></div><div class="tab"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><div class="side"><div class="scene"><small>Move ${(a.choices?.length||0)+1} · ${esc(s.title)}</small><h2>${esc(n.scene||s.title)}</h2><p>${esc(n.copy||n.prompt||'')}</p></div><div class="feed"><h3>Live feed</h3>${v.feed.map((x,i)=>`<div class="feedline"><span class="dot ${i===0?v.cls:''}"></span><span>${esc(x)}</span></div>`).join('')}</div><div class="actionsBox"><h3>Available actions</h3>${(n.choices||[]).map(c=>`<button class="choice" data-choice="${esc(c.id)}"><strong>${esc(c.label)}</strong></button>`).join('')}</div></div></section>`}async function scenario(){const sid=scenarioId();page('<div class="between"><div><div class="pulse"></div><p class="eyebrow">Opening case</p><h1>The market loads.</h1></div></div>');try{const s0=await api('/api/forge/attempts',{method:'POST',body:JSON.stringify({scenario_id:sid})});let a=s0.forge?.attempt,s=s0.forge?.scenario_summary,n=s0.forge?.node;if(!a||!n)throw new Error('Attempt did not start correctly');const render=node=>{if(node.choices){page(cockpit(node,a,s));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{const label=b.textContent;b.disabled=true;page(`<div class="between"><div><div class="pulse"></div><p class="eyebrow">The market moves</p><h1>${esc(label)}</h1></div></div>`);try{const out=await api(`/api/forge/attempts/${a.attempt_id}/choice`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});a=out.forge?.attempt||a;render(out.forge?.node)}catch(e){page(shell('Action failed','The move did not save.',String(e.message||e)))}})}else{const o=node.outcome||a.outcome||{},v=screen(node),mist=(o.top_mistakes||[]).map(m=>`<div class="row"><b>${esc(m.tag.replaceAll('_',' '))}</b></div>`).join('')||'<p class="copy">No major mistake tags recorded.</p>',str=(o.strengths||[]).map(x=>`<div class="row"><b>${esc(x)}</b></div>`).join('')||'<p class="copy">No strength notes recorded.</p>';page(shell('Case autopsy',o.profile||node.profile||s.title,node.result||o.result||'Case complete.',`<div class="market" style="margin:18px 0"><div class="ticker"><div class="metric cash ${v.cls}"><small>Final cash-out</small><b>${v.position==='No trade'?'—':'$'+v.cash}</b></div><div class="metric"><small>Final position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><div class="result"><p class="copy"><b>Diagnosis:</b> ${esc(node.diagnosis||o.diagnosis||'No diagnosis supplied.')}</p><p class="scar">${esc(node.scar||o.scar||a.scar_unlocked||s.scar)}</p></div><div class="grid"><div class="card"><small>Profile</small><strong>${esc(o.profile||node.profile||'Complete')}</strong></div><div class="card"><small>Score</small><strong>${esc(o.score_total??a.score_total??0)}</strong></div><div class="card"><small>Moves</small><strong>${esc(a.choices?.length||0)}</strong></div></div><div class="autopsy"><div><h2>What got you</h2>${mist}</div><div><h2>What worked</h2>${str}</div></div><div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/${encodeURIComponent(sid)}">Run it again</a><a class="btn" href="/app/history">View history</a><a class="btn" href="/app/second-stake">Back</a></div>`))}};render(n)}catch(e){page(shell('Case failed to load','The scenario did not start.',String(e.message||e)))}}function route(){if(path==='/')return home();if(path==='/app')return home();if(path==='/app/products')return products();if(path==='/app/second-stake')return secondStake();if(path==='/app/history')return history();if(path.startsWith('/app/second-stake/scenarios/'))return scenario();return home()}route();</script></body></html>
