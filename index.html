<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds X-Ray · The Ox</title>
  <style>
    :root{color-scheme:dark;--bg:#050609;--panel:rgba(18,20,27,.88);--line:rgba(255,255,255,.14);--text:#f6f0db;--muted:rgba(246,240,219,.68);--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 5%,rgba(240,51,47,.22),transparent 32%),radial-gradient(circle at 88% 10%,rgba(52,130,255,.20),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#fff6ce 0 48%,var(--red) 49%);color:#080808;display:grid;place-items:center;font-weight:950;box-shadow:12px 12px 0 rgba(52,130,255,.18)}.brand b,.brand em{display:block}.brand em{font-style:normal;color:var(--muted);font-size:13px}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a,.button{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.04);font-weight:800}.button.primary{background:var(--yellow);color:#080808;border-color:rgba(255,223,89,.8)}button.button{color:inherit;font:inherit;cursor:pointer}.panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.55);padding:clamp(24px,5vw,54px);margin-bottom:18px}.panel:after{content:"";position:absolute;inset:auto -10% -12% -10%;height:140px;background:linear-gradient(110deg,transparent 0 14%,rgba(52,130,255,.40) 15% 32%,transparent 33% 47%,rgba(240,51,47,.45) 48% 61%,rgba(255,223,89,.26) 62% 73%,rgba(37,211,102,.25) 74% 88%,transparent 89%);opacity:.30;pointer-events:none}.stripe{height:16px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.20em;color:var(--yellow);font-weight:950;font-size:12px}h1{font-size:clamp(44px,8vw,88px);line-height:.9;letter-spacing:-.07em;margin:8px 0 20px}.lede{font-size:clamp(19px,3vw,31px);line-height:1.25;color:var(--muted);max-width:880px}.copy{font-size:18px;line-height:1.55;color:var(--muted);max-width:880px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:26px}.card,.choice{border:1px solid var(--line);border-radius:22px;background:rgba(0,0,0,.24);padding:18px;text-align:left}.card small{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:900}.card strong{display:block;font-size:25px;margin:8px 0}.choice{width:100%;color:var(--text);font:inherit;cursor:pointer}.choice:hover{border-color:rgba(255,223,89,.7);background:rgba(255,223,89,.08)}.choice strong{display:block;font-size:19px}.casebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:20px 0}.pill{border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.22);padding:12px}.pill small{display:block;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.pill b{display:block;margin-top:4px}.scene{border-left:7px solid var(--blue);padding-left:18px}.result{border-left:7px solid var(--red);padding-left:18px}.scar{display:inline-block;margin-top:12px;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:14px 16px;color:#fff6ce;font-weight:900}.status{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(246,240,219,.55);font-size:13px;margin-top:18px;word-break:break-all}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.history{margin-top:20px}.row{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,0,0,.24)}footer{display:flex;justify-content:space-between;gap:12px;color:rgba(246,240,219,.45);font-size:13px;padding:16px 4px}@media(max-width:760px){.nav{display:none}.panel{border-radius:26px}.mark{width:46px;height:46px}h1{font-size:52px}.lede{font-size:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="mark">OX</span><span><b>Odds X-Ray</b><em>The Ox</em></span></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a><a href="/health">Health</a></nav></header>
    <div id="app"></div>
    <footer><b>OX-006A</b><span>The Site sells. The Ox trains. The Forge remembers.</span></footer>
  </main>
  <script>
    const app=document.getElementById('app');
    const path=location.pathname.replace(/\/$/,'')||'/';
    const esc=(v)=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const page=(html)=>{app.innerHTML=html};
    const shell=(eyebrow,title,lede,body='')=>`<section class="panel"><div class="stripe"></div><p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1><p class="lede">${esc(lede)}</p>${body}</section>`;
    async function api(url, opts={}){const r=await fetch(url,{cache:'no-store',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.forge?.error||data.error||'Request failed');return data;}
    function home(){page(shell('The Ox · Casefile layer','Second Stake is now a playable case, not a quiz.','The first scenario is a pressure-driven market mistake simulator with scenes, actions, consequences, hidden state, and an autopsy.','<div class="actions"><a class="button primary" href="/app/second-stake/scenarios/s01-the-180-window">Play The $180 Window</a><a class="button" href="/app/history">View History</a><a class="button" href="/api/forge/health">Forge Health</a></div><div class="grid"><div class="card"><small>Build</small><strong>OX-006A</strong><p class="copy">Dynamic casefile player.</p></div><div class="card"><small>Mode</small><strong>Game, not quiz</strong><p class="copy">Buttons are actions. Diagnosis comes after the run.</p></div><div class="card"><small>Forge</small><strong>FORGE-004A</strong><p class="copy">The $180 Window is live.</p></div></div>'))}
    function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is Product 001. The first playable case is live; the remaining cases stay locked until the format is right.','<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">Controlled first-loss case files for new prediction-market players.</p></a><div class="card"><small>Future module</small><strong>Cash-Out Scars</strong><p class="copy">Exit windows, greed, partial sells, and one more tick.</p></div><div class="card"><small>Future module</small><strong>Headline Poison</strong><p class="copy">When the story was right but the contract paid something else.</p></div></div>'))}
    async function secondStake(){page(shell('Product 001','Loading Second Stake','The Ox is reading the Forge scenario catalog.'));try{const data=await api('/api/forge/scenarios');const scenarios=data.forge?.scenarios||[];const cards=scenarios.map(s=>`<a class="card" href="${s.status==='locked'?'#':'/app/second-stake/scenarios/'+encodeURIComponent(s.id)}"><small>${s.status==='locked'?'Locked case':'Playable case'} · ${esc(s.format||'casefile')}</small><strong>${esc(s.title)}</strong><p class="copy">${esc(s.subtitle||s.scar||'')}</p>${s.status==='locked'?'<p class="status">Locked until Scenario 01 proves the format.</p>':'<p class="scar">Start case</p>'}</a>`).join('');page(shell('Product 001','Second Stake','A first-loss simulator. Not a quiz. Each case should feel like a live mistake unfolding under pressure.',`<div class="grid">${cards}</div><div class="actions"><a class="button" href="/app/history">View attempts</a><a class="button" href="/api/forge/scenarios">Raw Forge source</a></div>`));}catch(e){page(shell('Second Stake unavailable','The Forge did not return the catalog.',String(e.message||e)));}}
    async function history(){page(shell('History','Loading attempt history','The Ox is asking The Forge for recorded decisions.'));try{const [attempts,progress]=await Promise.all([api('/api/forge/attempts'),api('/api/forge/progress')]);const rows=(attempts.forge?.attempts||[]).map(a=>`<div class="row"><b>${esc(a.scenario_title||a.scenario_id)}</b><p class="copy">Status: ${esc(a.status)} · Choices: ${esc(a.choices_count)} · Profile: ${esc(a.profile||'none yet')}</p><p class="scar">${esc(a.scar_unlocked||'No scar unlocked yet')}</p><p class="status">${esc(a.attempt_id)}</p></div>`).join('')||'<p class="copy">No attempts recorded yet.</p>';const p=progress.forge?.progress||{};page(shell('Attempt history','The Forge is remembering.','Every completed run becomes a saved behavioral autopsy.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${p.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${p.completed_attempts||0}</strong></div><div class="card"><small>Scars unlocked</small><strong>${p.scars_unlocked||0}</strong></div></div><div class="history">${rows}</div><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/s01-the-180-window">Run The $180 Window</a></div>`));}catch(e){page(shell('History unavailable','The Forge did not return history.',String(e.message||e)));}}
    function scenarioIdFromPath(){const prefix='/app/second-stake/scenarios/';return decodeURIComponent(path.startsWith(prefix)?path.slice(prefix.length):'s01-the-180-window');}
    async function scenario(){const scenarioId=scenarioIdFromPath();page(shell('Second Stake Casefile','Opening case file','The Ox is creating a saved attempt in The Forge.','<p class="status">POST /api/forge/attempts</p>'));try{const started=await api('/api/forge/attempts',{method:'POST',body:JSON.stringify({scenario_id:scenarioId})});let attempt=started.forge?.attempt;let scenario=started.forge?.scenario_summary;let current=started.forge?.node;if(!attempt||!current)throw new Error('Attempt did not start correctly');const renderNode=(node)=>{if(node.choices){const stats=`<div class="casebar"><div class="pill"><small>Case</small><b>${esc(scenario.title)}</b></div><div class="pill"><small>Scene</small><b>${esc(node.scene||node.id)}</b></div><div class="pill"><small>Actions taken</small><b>${attempt.choices?.length||0}</b></div></div>`;page(shell('Second Stake · Casefile',node.scene||scenario.title,node.prompt,`${stats}<div class="scene"><p class="copy">Choose an action. The game will not tell you whether it was smart until the autopsy.</p></div><div class="grid">${node.choices.map(c=>`<button class="choice" data-choice="${esc(c.id)}"><strong>${esc(c.label)}</strong></button>`).join('')}</div><p class="status">Attempt: ${esc(attempt.attempt_id)}</p>`));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{const label=b.textContent;b.disabled=true;page(shell('Recording action','The Forge is saving your move.',label,'<p class="status">POST choice</p>'));try{const out=await api(`/api/forge/attempts/${attempt.attempt_id}/choice`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});attempt=out.forge?.attempt||attempt;renderNode(out.forge?.node);}catch(e){page(shell('Action failed','The Forge rejected the move.',String(e.message||e)));}});}else{const out=node.outcome||attempt.outcome||{};const mistakes=(out.top_mistakes||[]).map(m=>`<div class="row"><b>${esc(m.tag)}</b><p class="copy">Seen ${esc(m.count)} time(s)</p></div>`).join('')||'<p class="copy">No major mistake tags recorded.</p>';const strengths=(out.strengths||[]).map(s=>`<div class="row"><b>${esc(s)}</b></div>`).join('')||'<p class="copy">No strength notes recorded.</p>';page(shell('Case autopsy',out.profile||node.profile||scenario.title,node.result||out.result||'Case complete.',`<div class="result"><p class="copy"><b>Diagnosis:</b> ${esc(node.diagnosis||out.diagnosis||'No diagnosis supplied.')}</p><p class="scar">${esc(node.scar||out.scar||attempt.scar_unlocked||scenario.scar)}</p></div><div class="grid"><div class="card"><small>Profile</small><strong>${esc(out.profile||node.profile||'Complete')}</strong></div><div class="card"><small>Score</small><strong>${esc(out.score_total??attempt.score_total??0)}</strong></div><div class="card"><small>Moves</small><strong>${esc(attempt.choices?.length||0)}</strong></div></div><h2>What the game saw</h2><div class="grid"><div>${mistakes}</div><div>${strengths}</div></div><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/${encodeURIComponent(scenarioId)}">Run it again</a><a class="button" href="/app/history">View history</a><a class="button" href="/app/second-stake">Back to Second Stake</a></div><p class="status">Saved attempt: ${esc(attempt.attempt_id)}</p>`));}};renderNode(current);}catch(e){page(shell('Case failed to load','The scenario did not start.',String(e.message||e),`<div class="actions"><a class="button" href="/api/forge/scenarios/${encodeURIComponent(scenarioId)}">Open raw Forge scenario</a></div>`));}}
    function route(){ if(path==='/')return home(); if(path==='/app')return home(); if(path==='/app/products')return products(); if(path==='/app/second-stake')return secondStake(); if(path==='/app/history')return history(); if(path.startsWith('/app/second-stake/scenarios/'))return scenario(); return home(); }
    route();
  </script>
</body>
</html>
