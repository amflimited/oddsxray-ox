<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ox · Odds X-Ray</title>
<style>
:root{color-scheme:dark;--bg:#050609;--ink:#f7f0d8;--muted:rgba(247,240,216,.68);--faint:rgba(247,240,216,.42);--line:rgba(255,255,255,.14);--card:rgba(12,14,20,.82);--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff;--black:#050609}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}body{background:radial-gradient(circle at 9% -4%,rgba(240,51,47,.26),transparent 34%),radial-gradient(circle at 94% 0,rgba(52,130,255,.23),transparent 32%),linear-gradient(180deg,#07080c,#050609 52%,#07080c)}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:18px 0 max(34px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#fff4bd 0 47%,var(--red) 48% 100%);color:#080808;display:grid;place-items:center;font-weight:1000;box-shadow:10px 10px 0 rgba(52,130,255,.18)}.brand b,.brand span{display:block}.brand span{font-size:13px;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.045);font-weight:850}.btn.primary{background:var(--yellow);color:#050609;border-color:rgba(255,223,89,.88)}.btn.red{background:var(--red);border-color:rgba(240,51,47,.75)}.hero,.panel,.card,.market,.side,.evidence,.actionsBox,.feed{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),var(--card);box-shadow:0 28px 90px rgba(0,0,0,.52)}.hero{position:relative;overflow:hidden;border-radius:34px;padding:clamp(24px,6vw,64px);min-height:560px}.hero:before{content:"";position:absolute;right:-10%;top:-18%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,223,89,.22),transparent 66%);pointer-events:none}.stripe{height:15px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:24px}.eyebrow,.kicker,.sectionTitle{color:var(--yellow);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:950}.hero h1{font-size:clamp(50px,10vw,118px);line-height:.84;letter-spacing:-.08em;margin:10px 0 22px;max-width:850px}.lede{font-size:clamp(19px,3vw,31px);line-height:1.22;color:var(--muted);max-width:860px}.copy{font-size:17px;line-height:1.5;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}.card{border-radius:24px;padding:20px}.card small{display:block;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;font-weight:900}.card strong{display:block;font-size:25px;line-height:1.05;margin:8px 0}.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.terminal{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#050609;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(247,240,216,.75);font-size:13px;line-height:1.5}.terminal b{color:var(--green)}.terminal .bad{color:var(--red)}.window{border:1px solid rgba(255,255,255,.12);border-radius:26px;overflow:hidden;background:rgba(0,0,0,.26)}.ticker{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.metric{padding:13px}.metric small,.tab small{display:block;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:900}.metric b{display:block;font-size:clamp(24px,5vw,40px);letter-spacing:-.05em}.cash b{color:var(--green)}.chart{height:155px;padding:12px}.chart svg{width:100%;height:100%}.line{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}.tab{border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:9px;background:rgba(0,0,0,.22)}.tab b{font-size:12px}.panel{border-radius:30px;padding:clamp(22px,5vw,52px);margin-top:16px}.panel h1{font-size:clamp(42px,8vw,84px);line-height:.9;letter-spacing:-.065em;margin:8px 0 18px}.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:14px}.market,.side{border-radius:26px;overflow:hidden}.side{padding:18px}.scene small{color:var(--yellow);text-transform:uppercase;letter-spacing:.16em;font-weight:950;font-size:11px}.scene h2{font-size:clamp(31px,7vw,48px);line-height:.95;letter-spacing:-.045em;margin:8px 0 12px}.scene p{font-size:17px;line-height:1.45;color:var(--muted);margin:0}.evidence,.feed,.actionsBox{margin-top:14px;border-radius:22px;padding:16px}.evidenceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}.eCard{border:1px solid rgba(255,255,255,.11);border-radius:16px;background:rgba(0,0,0,.2);padding:12px}.eCard b{display:block;margin:5px 0 7px}.eCard p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}.feedline{display:flex;gap:9px;border-top:1px solid rgba(255,255,255,.08);padding:10px 0;color:var(--muted);font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:0 0 auto}.choice{width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.24);color:var(--ink);padding:15px;text-align:left;margin:0 0 10px;cursor:pointer}.choice:hover{border-color:rgba(255,223,89,.72);background:rgba(255,223,89,.08)}.choice strong{display:block;font-size:17px}.choice small{display:block;color:var(--faint);margin-top:7px}.between{display:grid;place-items:center;min-height:58vh;text-align:center}.pulse{width:82px;height:82px;border-radius:50%;border:1px solid rgba(255,223,89,.35);background:radial-gradient(circle,rgba(255,223,89,.25),rgba(255,223,89,.02));animation:pulse 1s infinite alternate;margin:0 auto 20px}@keyframes pulse{from{transform:scale(.95);opacity:.75}to{transform:scale(1.05);opacity:1}}.scar{display:inline-block;margin-top:12px;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:13px 15px;color:#fff6ce;font-weight:900}.row{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,0,0,.22)}footer{display:flex;justify-content:space-between;gap:12px;color:rgba(247,240,216,.42);font-size:13px;padding:14px 4px}@media(max-width:860px){.shell{width:100%;padding:10px 8px max(20px,env(safe-area-inset-bottom))}.top{padding:0 2px}.nav{display:none}.brand span{display:none}.mark{width:42px;height:42px;border-radius:12px}.hero{border-radius:24px;min-height:auto;padding:20px}.hero h1{font-size:54px}.lede{font-size:20px}.stage{grid-template-columns:1fr}.cockpit{display:flex;flex-direction:column}.ticker{position:sticky;top:0;z-index:2}.metric{padding:8px}.metric small{font-size:9px}.metric b{font-size:25px}.chart{height:96px;padding:7px}.tabs{gap:5px;padding:7px}.tab{padding:6px;border-radius:12px}.tab small{font-size:7px}.tab b{font-size:11px}.side{padding:14px;border-radius:20px}.scene h2{font-size:31px}.scene p{font-size:15px}.evidence,.feed{padding:10px}.evidenceGrid{display:flex;overflow-x:auto;padding-bottom:4px}.eCard{min-width:215px}.feedline{font-size:12px;padding:6px 0}.feedline:nth-of-type(n+3){display:none}.actionsBox{position:sticky;bottom:env(safe-area-inset-bottom);z-index:5;background:rgba(12,14,20,.96);backdrop-filter:blur(14px);box-shadow:0 -16px 36px rgba(0,0,0,.38);padding:10px}.choice{min-height:48px;padding:12px 14px;border-radius:16px}.choice small{display:none}.grid{grid-template-columns:1fr}.hideMobile{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><a class="brand" href="/"><span class="mark">OX</span><span><b>Odds X-Ray</b><em>The Ox</em></span></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a></nav></header>
<div id="app"></div>
<footer><b>OX-010A</b><span class="hideMobile">The Ox is the training chamber for Odds X-Ray.</span></footer>
</main>
<script>
const app=document.getElementById('app'),path=location.pathname.replace(/\/$/,'')||'/';
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const page=h=>{app.innerHTML=h;scrollTo({top:0,behavior:'smooth'})};
async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.forge?.error||d.error||'Request failed');return d}
function shell(e,t,l,b=''){return `<section class="panel"><div class="stripe"></div><p class="eyebrow">${esc(e)}</p><h1>${esc(t)}</h1><p class="lede">${esc(l)}</p>${b}</section>`}
function miniChart(){return '<svg viewBox="0 0 368 170" preserveAspectRatio="none"><path class="line" d="M8 142 C55 118 82 136 122 88 C164 36 199 70 236 26 C276 -8 321 80 360 42"/><rect x="30" y="112" width="18" height="42" fill="rgba(37,211,102,.45)"/><rect x="85" y="90" width="18" height="52" fill="rgba(37,211,102,.55)"/><rect x="140" y="52" width="18" height="75" fill="rgba(255,223,89,.66)"/><rect x="220" y="58" width="18" height="72" fill="rgba(240,51,47,.62)"/><rect x="285" y="94" width="18" height="58" fill="rgba(240,51,47,.72)"/></svg>'}
function home(){page(`<section class="hero"><div class="stripe"></div><p class="eyebrow">Odds X-Ray training chamber</p><h1>Touch the stove before the market does it for real.</h1><p class="lede">The Ox is where prediction-market beginners are put inside controlled first-loss simulations: green numbers, thin exits, social noise, bad assumptions, and the cash-out door that does not wait.</p><div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window">Enter The $180 Window</a><a class="btn" href="/app/second-stake">View Second Stake</a><a class="btn" href="/api/packages">Live package status</a></div><div class="stage"><div class="window"><div class="ticker"><div class="metric cash"><small>Cash-out</small><b>$180</b></div><div class="metric"><small>Position</small><b>$100</b></div><div class="metric"><small>Timer</small><b>3:00</b></div></div><div class="chart">${miniChart()}</div><div class="tabs"><div class="tab"><small>Rules</small><b>Buried</b></div><div class="tab"><small>Source</small><b>Pending</b></div><div class="tab"><small>Book</small><b>Thin</b></div><div class="tab"><small>Risk</small><b>Rising</b></div></div></div><div class="terminal"><b>CASE 001: THE $180 WINDOW</b><br>Player sees profit.<br>Player sees urgency.<br>Player has not checked the rule.<br><br><span class="bad">Failure mode:</span> screenshots, comments, and a green number become a fake proof stack.<br><br><b>Training goal:</b> make the first-loss mistake hurt without using real money.</div></div></section><section class="grid"><div class="card"><small>Product 001</small><strong>Second Stake</strong><p class="copy">A first-loss simulator that teaches exits, contract reading, source checking, and position control.</p></div><div class="card"><small>Current case</small><strong>The $180 Window</strong><p class="copy">A cash-out number appears, narrows, and disappears while the player decides what evidence matters.</p></div><div class="card"><small>Operating model</small><strong>Site · Ox · Forge</strong><p class="copy">The site sells the experience. The Ox runs the cockpit. The Forge remembers attempts and autopsies.</p></div></section>`)}
function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is the first product in the library. Future modules can train separate prediction-market failure modes.',`<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">First-loss simulations for contract reading, cash-out discipline, and thin-exit awareness.</p></a><div class="card"><small>Future module</small><strong>Headline Poison</strong><p class="copy">When the story is true but the contract does not pay that story.</p></div><div class="card"><small>Future module</small><strong>Liquidity Mirage</strong><p class="copy">When the displayed price exists but your actual exit does not.</p></div></div>`))}
async function secondStake(){page(shell('Product 001','Loading Second Stake','Reading the Forge scenario catalog.'));try{const d=await api('/api/forge/scenarios'),s=d.forge?.scenarios||[],cards=s.map(x=>`<a class="card" href="${x.status==='locked'?'#':'/app/second-stake/scenarios/'+encodeURIComponent(x.id)}"><small>${x.status==='locked'?'Locked case':'Playable case'} · ${esc(x.format||'')}</small><strong>${esc(x.title)}</strong><p class="copy">${esc(x.subtitle||x.scar||'')}</p>${x.status==='locked'?'<p class="copy">Locked until Scenario 01 proves the format.</p>':'<p class="scar">Start case</p>'}</a>`).join('');page(shell('Product 001','Second Stake','Controlled first-loss training. Each case combines a market cockpit, evidence board, decision tree, and behavioral autopsy.',`<div class="grid">${cards}</div><div class="actions"><a class="btn" href="/app/history">View attempts</a></div>`))}catch(e){page(shell('Second Stake unavailable','The Forge did not return the catalog.',String(e.message||e)))}}
async function history(){page(shell('History','Loading attempt history','The Ox is asking The Forge for recorded decisions.'));try{const [a,p]=await Promise.all([api('/api/forge/attempts'),api('/api/forge/progress')]),rows=(a.forge?.attempts||[]).map(x=>`<div class="row"><b>${esc(x.scenario_title||x.scenario_id)}</b><p class="copy">${esc(x.status)} · ${esc(x.choices_count)} moves · ${esc(x.profile||'unfinished')}</p>${x.scar_unlocked?`<p class="scar">${esc(x.scar_unlocked)}</p>`:''}</div>`).join('')||'<p class="copy">No attempts recorded yet.</p>',q=p.forge?.progress||{};page(shell('Attempt history','The Forge remembers the scar tissue.','Each completed run becomes a behavioral autopsy.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${q.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${q.completed_attempts||0}</strong></div><div class="card"><small>Scars unlocked</small><strong>${q.scars_unlocked||0}</strong></div></div><div>${rows}</div><div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window">Run The $180 Window</a></div>`))}catch(e){page(shell('History unavailable','The Forge did not return history.',String(e.message||e)))}}
function scenarioId(){const p='/app/second-stake/scenarios/';return decodeURIComponent(path.startsWith(p)?path.slice(p.length):'s01-the-180-window')}
function fallbackScreen(n){return{cashout:171,position:'$100',timer:'8:00',rules:'Buried',source:'Pending',book:'Thin',risk:'Rising',chart:'up',feed:['Cash-out is green but not guaranteed.','You already put $100 into the market.','The official trigger is still unresolved.']}}
function screen(n){const s=n?.screen||fallbackScreen(n);let cash=Number(s.cashout||0),cls=cash<=75?'danger':cash<=150?'warn':'';return{cash,cls,position:s.position||'Watch',timer:s.timer||'--',rules:s.rules||'Unknown',source:s.source||'Pending',book:s.book||'Thin',risk:s.risk||'Unknown',chart:s.chart||'flat',feed:Array.isArray(s.feed)?s.feed:[]}}
function chart(v){const p=v.chart==='up'?'M8 150 C50 124 74 138 112 90 C150 42 190 70 238 28 C292 -12 324 60 360 40':v.chart==='down'?'M8 44 C52 60 82 34 120 72 C156 112 200 90 238 130 C274 168 316 132 360 180':v.chart==='warn'?'M8 84 C48 78 92 64 132 78 C174 92 206 82 244 102 C284 122 322 108 360 126':'M8 96 C52 90 90 102 132 94 C178 86 210 104 252 94 C294 84 326 100 360 92';return`<svg viewBox="0 0 368 190" preserveAspectRatio="none"><path class="line ${v.cls}" d="${p}"/><rect x="28" y="116" width="18" height="44" fill="rgba(37,211,102,.45)"/><rect x="76" y="92" width="18" height="52" fill="rgba(37,211,102,.55)"/><rect x="124" y="62" width="18" height="70" fill="rgba(255,223,89,.65)"/><rect x="220" y="60" width="18" height="72" fill="rgba(240,51,47,.62)"/><rect x="268" y="94" width="18" height="64" fill="rgba(240,51,47,.72)"/></svg>`}
function evidence(n){const ev=Array.isArray(n.evidence)?n.evidence:[];if(!ev.length)return '';return`<div class="evidence"><span class="sectionTitle">Evidence board</span><div class="evidenceGrid">${ev.map(e=>`<div class="eCard"><span class="sectionTitle">${esc(e.type||e.status||'evidence')}</span><b>${esc(e.label)}</b><p>${esc(e.display||'')}</p>${e.basis?`<p>${esc(e.basis)}</p>`:''}</div>`).join('')}</div></div>`}
function cockpit(n,a,s){const v=screen(n),cash=v.position==='No trade'?'—':'$'+v.cash;return`<section class="cockpit"><div class="market"><div class="ticker"><div class="metric cash ${v.cls}"><small>Cash-out</small><b>${cash}</b></div><div class="metric"><small>Position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Timer</small><b>${esc(v.timer)}</b></div></div><div class="chart">${chart(v)}</div><div class="tabs"><div class="tab"><small>Rules</small><b>${esc(v.rules)}</b></div><div class="tab"><small>Source</small><b>${esc(v.source)}</b></div><div class="tab"><small>Book</small><b>${esc(v.book)}</b></div><div class="tab"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><div class="side"><div class="scene"><small>Move ${(a.choices?.length||0)+1} · ${esc(s.title)}</small><h2>${esc(n.scene||s.title)}</h2><p>${esc(n.copy||n.prompt||'')}</p></div>${evidence(n)}<div class="feed"><span class="sectionTitle">Live feed</span>${v.feed.map((x,i)=>`<div class="feedline"><span class="dot ${i===0?v.cls:''}"></span><span>${esc(x)}</span></div>`).join('')}</div><div class="actionsBox"><span class="sectionTitle">Available actions</span>${(n.choices||[]).map(c=>`<button class="choice" data-choice="${esc(c.id)}"><strong>${esc(c.label)}</strong>${Array.isArray(c.basis)&&c.basis[0]?`<small>${esc(c.basis[0])}</small>`:''}</button>`).join('')}</div></div></section>`}
async function scenario(){const sid=scenarioId();page('<div class="between"><div><div class="pulse"></div><p class="eyebrow">Opening case</p><h1>The market loads.</h1></div></div>');try{const s0=await api('/api/forge/attempts',{method:'POST',body:JSON.stringify({scenario_id:sid})});let a=s0.forge?.attempt,s=s0.forge?.scenario_summary,n=s0.forge?.node;if(!a||!n)throw new Error('Attempt did not start correctly');const render=node=>{if(node.choices){page(cockpit(node,a,s));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{b.disabled=true;page(`<div class="between"><div><div class="pulse"></div><p class="eyebrow">The market moves</p><h1>${esc(b.textContent)}</h1></div></div>`);try{const out=await api(`/api/forge/attempts/${a.attempt_id}/choice`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});a=out.forge?.attempt||a;render(out.forge?.node)}catch(e){page(shell('Action failed','The move did not save.',String(e.message||e)))}})}else{const o=node.outcome||a.outcome||{},v=screen(node),mist=(o.top_mistakes||[]).map(m=>`<div class="row"><b>${esc(m.tag.replaceAll('_',' '))}</b></div>`).join('')||'<p class="copy">No major mistake tags recorded.</p>';page(shell('Case autopsy',o.profile||node.profile||s.title,node.result||o.result||'Case complete.',`<div class="window" style="margin:18px 0"><div class="ticker"><div class="metric cash ${v.cls}"><small>Final cash-out</small><b>${v.position==='No trade'?'—':'$'+v.cash}</b></div><div class="metric"><small>Final position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><p class="copy"><b>Diagnosis:</b> ${esc(node.diagnosis||o.diagnosis||'No diagnosis supplied.')}</p><p class="scar">${esc(node.scar||o.scar||a.scar_unlocked||s.scar)}</p><div class="grid"><div class="card"><small>Profile</small><strong>${esc(o.profile||node.profile||'Complete')}</strong></div><div class="card"><small>Score</small><strong>${esc(o.score_total??a.score_total??0)}</strong></div><div class="card"><small>Moves</small><strong>${esc(a.choices?.length||0)}</strong></div></div><h2>What got you</h2>${mist}<div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/${encodeURIComponent(sid)}">Run it again</a><a class="btn" href="/app/history">View history</a><a class="btn" href="/app/second-stake">Back</a></div>`))}};render(n)}catch(e){page(shell('Case failed to load','The scenario did not start.',String(e.message||e)))}}
function route(){if(path==='/')return home();if(path==='/app')return home();if(path==='/app/products')return products();if(path==='/app/second-stake')return secondStake();if(path==='/app/history')return history();if(path.startsWith('/app/second-stake/scenarios/'))return scenario();return home()}route();
</script>
</body>
</html>
