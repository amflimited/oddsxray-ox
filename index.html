<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odds X-Ray · The Ox</title>
  <style>
    :root{color-scheme:dark;--bg:#050609;--panel:#11141c;--panel2:#171b25;--line:rgba(255,255,255,.13);--text:#f6f0db;--muted:rgba(246,240,219,.66);--faint:rgba(246,240,219,.42);--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff;--black:#050609}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100%;margin:0;background:radial-gradient(circle at 10% 0,rgba(240,51,47,.18),transparent 30%),radial-gradient(circle at 95% 3%,rgba(52,130,255,.16),transparent 31%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1160px,calc(100% - 28px));margin:0 auto;padding:18px 0 max(34px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#fff6ce 0 48%,var(--red) 49%);color:#080808;display:grid;place-items:center;font-weight:950;box-shadow:10px 10px 0 rgba(52,130,255,.17)}.brand b,.brand em{display:block}.brand em{font-style:normal;color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.button{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.04);font-weight:850}.button.primary{background:var(--yellow);color:#080808;border-color:rgba(255,223,89,.8)}.panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025)),rgba(17,20,28,.92);box-shadow:0 28px 90px rgba(0,0,0,.54);padding:clamp(22px,5vw,52px);margin-bottom:16px}.panel:after{content:"";position:absolute;inset:auto -8% -16% -8%;height:128px;background:linear-gradient(110deg,transparent 0 15%,rgba(52,130,255,.34) 16% 32%,transparent 33% 48%,rgba(240,51,47,.40) 49% 62%,rgba(255,223,89,.22) 63% 74%,rgba(37,211,102,.20) 75% 88%,transparent 89%);opacity:.20;pointer-events:none}.stripe{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.20em;color:var(--yellow);font-weight:950;font-size:12px}h1{font-size:clamp(42px,8vw,84px);line-height:.9;letter-spacing:-.065em;margin:8px 0 18px}.lede{font-size:clamp(18px,2.7vw,29px);line-height:1.25;color:var(--muted);max-width:900px}.copy{font-size:17px;line-height:1.55;color:var(--muted);max-width:900px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.card,.choice{border:1px solid var(--line);border-radius:22px;background:rgba(0,0,0,.24);padding:18px;text-align:left}.card small{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:900}.card strong{display:block;font-size:24px;margin:8px 0}.quiet{color:var(--faint);font-size:13px}.scar{display:inline-block;margin-top:12px;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:13px 15px;color:#fff6ce;font-weight:900}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.history{margin-top:18px}.row{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,0,0,.22)}footer{display:flex;justify-content:space-between;gap:12px;color:rgba(246,240,219,.42);font-size:13px;padding:12px 4px}.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:14px}.market,.side,.feed,.actionrail{border:1px solid var(--line);border-radius:26px;background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(8,10,15,.78);box-shadow:0 18px 52px rgba(0,0,0,.30)}.market{overflow:hidden}.ticker{display:flex;align-items:stretch;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}.metric{padding:14px 14px;min-width:0}.metric small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.metric b{display:block;font-size:clamp(24px,7vw,42px);letter-spacing:-.05em;margin-top:3px}.metric.cash b{color:var(--green)}.metric.cash.danger b{color:var(--red)}.metric.cash.warn b{color:var(--yellow)}.chart{height:220px;padding:14px}.chart svg{width:100%;height:100%;display:block}.chartline{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(37,211,102,.3))}.chartline.warn{stroke:var(--yellow)}.chartline.danger{stroke:var(--red)}.chartgrid{stroke:rgba(255,255,255,.08);stroke-width:1}.candles rect{rx:4}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;border-top:1px solid var(--line)}.tab{min-height:78px;border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(0,0,0,.22)}.tab small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.tab b{display:block;margin-top:5px}.tab.hot{border-color:rgba(255,223,89,.42);box-shadow:inset 0 0 0 1px rgba(255,223,89,.12)}.side{padding:18px}.scenehead small{color:var(--yellow);text-transform:uppercase;letter-spacing:.16em;font-weight:950;font-size:11px}.scenehead h2{font-size:clamp(30px,7vw,46px);line-height:.95;letter-spacing:-.045em;margin:8px 0 12px}.scenehead p{font-size:17px;line-height:1.45;color:var(--muted);margin:0}.feed{margin-top:14px;padding:14px}.feed h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}.feedline{display:flex;gap:9px;border-top:1px solid rgba(255,255,255,.08);padding:10px 0;color:var(--muted);font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:0 0 auto}.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}.dot.green{background:var(--green)}.actionrail{margin-top:14px;padding:14px}.actionrail h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}.choice{width:100%;color:var(--text);cursor:pointer;margin:0 0 10px;min-height:58px;transition:transform .12s ease,border-color .12s ease,background .12s ease}.choice:active{transform:scale(.99)}.choice:hover{border-color:rgba(255,223,89,.7);background:rgba(255,223,89,.08)}.choice strong{display:block;font-size:17px;line-height:1.2}.between{display:grid;place-items:center;min-height:58vh;text-align:center}.pulse{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,223,89,.35);background:radial-gradient(circle,rgba(255,223,89,.25),rgba(255,223,89,.02));animation:pulse 1s infinite alternate;margin:0 auto 20px}@keyframes pulse{from{transform:scale(.95);opacity:.75}to{transform:scale(1.05);opacity:1}}.result{border-left:7px solid var(--red);padding-left:18px}.autopsy{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:20px}@media(max-width:860px){.shell{width:100%;padding:12px 10px max(22px,env(safe-area-inset-bottom))}.topbar{padding:0 4px}.nav{display:none}.brand em{display:none}.mark{width:44px;height:44px}.panel{border-radius:24px;padding:20px}.cockpit{display:block}.ticker{position:sticky;top:0;z-index:2}.metric{padding:12px 10px}.metric b{font-size:30px}.chart{height:170px;padding:10px}.tabs{gap:8px;padding:10px}.tab{min-height:68px;padding:10px;border-radius:16px}.tab b{font-size:14px}.side{margin-top:12px;padding:16px;border-radius:22px}.scenehead h2{font-size:34px}.scenehead p{font-size:16px}.feed{border-radius:22px}.actionrail{position:sticky;bottom:env(safe-area-inset-bottom);z-index:5;border-radius:24px 24px 20px 20px;background:rgba(12,14,20,.96);backdrop-filter:blur(14px);box-shadow:0 -20px 48px rgba(0,0,0,.42);padding:12px}.choice{min-height:56px;padding:15px 16px}.choice strong{font-size:16px}.autopsy{display:block}.footerhide{display:none}footer{padding:10px 14px}.grid{grid-template-columns:1fr}h1{font-size:48px}.lede{font-size:20px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="mark">OX</span><span><b>Odds X-Ray</b><em>The Ox</em></span></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a></nav></header>
    <div id="app"></div>
    <footer><b>OX-007A</b><span class="footerhide">Mobile cockpit prototype.</span></footer>
  </main>
<script>
const app=document.getElementById('app');
const path=location.pathname.replace(/\/$/,'')||'/';
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const page=html=>{app.innerHTML=html;scrollTo({top:0,behavior:'smooth'});};
const shell=(eyebrow,title,lede,body='')=>`<section class="panel"><div class="stripe"></div><p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1><p class="lede">${esc(lede)}</p>${body}</section>`;
async function api(url,opts={}){const r=await fetch(url,{cache:'no-store',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.forge?.error||data.error||'Request failed');return data;}
function home(){page(shell('Mobile cockpit prototype','Second Stake is becoming a visual simulator.','The case now plays like a market screen under pressure: cash-out, chart, source, rules, feed, liquidity, and actions.','<div class="actions"><a class="button primary" href="/app/second-stake/scenarios/s01-the-180-window">Play The $180 Window</a><a class="button" href="/app/second-stake">Open Second Stake</a></div><div class="grid"><div class="card"><small>Build</small><strong>OX-007A</strong><p class="copy">Mobile-first cockpit.</p></div><div class="card"><small>Layout</small><strong>Thumb-first</strong><p class="copy">Actions stay near the bottom on phones.</p></div><div class="card"><small>Diagnosis</small><strong>After the run</strong><p class="copy">Gameplay first. Autopsy later.</p></div></div>'));}
function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is Product 001.','<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">Controlled first-loss simulations for new prediction-market players.</p></a><div class="card"><small>Future module</small><strong>Cash-Out Scars</strong><p class="copy">Exit windows, greed, partial sells, and one more tick.</p></div></div>'));}
async function secondStake(){page(shell('Product 001','Loading Second Stake','Reading the Forge scenario catalog.'));try{const data=await api('/api/forge/scenarios');const scenarios=data.forge?.scenarios||[];const cards=scenarios.map(s=>`<a class="card" href="${s.status==='locked'?'#':'/app/second-stake/scenarios/'+encodeURIComponent(s.id)}"><small>${s.status==='locked'?'Locked case':'Playable case'}</small><strong>${esc(s.title)}</strong><p class="copy">${esc(s.subtitle||s.scar||'')}</p>${s.status==='locked'?'<p class="quiet">Locked until Scenario 01 proves the format.</p>':'<p class="scar">Start case</p>'}</a>`).join('');page(shell('Product 001','Second Stake','A first-loss simulator. The first case is now a visual cockpit prototype.',`<div class="grid">${cards}</div><div class="actions"><a class="button" href="/app/history">View attempts</a></div>`));}catch(e){page(shell('Second Stake unavailable','The Forge did not return the catalog.',String(e.message||e)));}}
async function history(){page(shell('History','Loading attempt history','The Ox is asking The Forge for recorded decisions.'));try{const [attempts,progress]=await Promise.all([api('/api/forge/attempts'),api('/api/forge/progress')]);const rows=(attempts.forge?.attempts||[]).map(a=>`<div class="row"><b>${esc(a.scenario_title||a.scenario_id)}</b><p class="copy">${esc(a.status)} · ${esc(a.choices_count)} moves · ${esc(a.profile||'unfinished')}</p>${a.scar_unlocked?`<p class="scar">${esc(a.scar_unlocked)}</p>`:''}</div>`).join('')||'<p class="copy">No attempts recorded yet.</p>';const p=progress.forge?.progress||{};page(shell('Attempt history','The Forge is remembering.','Every completed run becomes a saved behavioral autopsy.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${p.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${p.completed_attempts||0}</strong></div><div class="card"><small>Scars unlocked</small><strong>${p.scars_unlocked||0}</strong></div></div><div class="history">${rows}</div><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/s01-the-180-window">Run The $180 Window</a></div>`));}catch(e){page(shell('History unavailable','The Forge did not return history.',String(e.message||e)));}}
function scenarioId(){const p='/app/second-stake/scenarios/';return decodeURIComponent(path.startsWith(p)?path.slice(p.length):'s01-the-180-window');}
function visual(node,attempt){const id=node?.id||'start',st=attempt?.state||{},moves=attempt?.choices?.length||0;let cash=171,cls='',source='Pending',rules=st.contract_read?'Read':'Buried',book='Thin',time=Math.max(0,8-(st.time_lost||0));if(['rules_tab','resolver_source','rule_written','small_entry','controlled_entry','liquidity_check','waiting_room','official_wait'].includes(id))cash=169;if(['buy_blind'].includes(id))cash=180;if(['buy_overconfident','add_on_green'].includes(id))cash=183;if(['cashout_slips','late_rules','rumor_spiral'].includes(id)){cash=146;cls='warn'}if(['official_pressure','stall_two'].includes(id)){cash=68;cls='danger'}if(['revenge_add'].includes(id)){cash=39;cls='danger'}if(id.includes('ending_zero')||id.includes('burnout')){cash=0;cls='danger'}if(id.includes('official')||st.resolver_checked)source='Checked';if(id==='official_pressure'||id==='official_wait')source='Updated';if(st.liquidity_checked||id==='liquidity_check')book='Checked';const position=Number(st.position||0);const risk=(st.panic||0)>3?'High':(st.panic||0)>0?'Rising':'Low';return{cash,cls,source,rules,book,time,position,risk,moves};}
function feed(node,vis){const id=node?.id||'start';let lines=['Cash-out estimate is moving.','The crowd is louder than the source.','The official trigger is still unresolved.'];if(id.includes('rules'))lines=['Rules tab opened.','The payout trigger is narrower than the headline.','Cash-out may vanish during volatility.'];if(id.includes('resolver')||id.includes('official'))lines=['Official source is the control point.','The update is not clean confirmation.','Market is pricing certainty before certainty exists.'];if(id.includes('liquidity'))lines=['Spread is wider than the headline number.','Small exits fill better than full exits.','Displayed price is not guaranteed cash.'];if(id.includes('cashout')||id.includes('stall'))lines=['The $180 window is gone.','Current estimate keeps stepping down.','Anchoring to the high is now the danger.'];if(id.includes('revenge'))lines=['Position is heavier than the original idea.','The next move is emotional rescue or emergency exit.','Size has become the trap.'];return lines.map((l,i)=>`<div class="feedline"><span class="dot ${i===0?vis.cls:''}"></span><span>${esc(l)}</span></div>`).join('');}
function chart(vis){const cls=vis.cls||'';const path=vis.cash>170?'M8 150 C50 124 74 138 112 90 C150 42 190 70 238 28 C292 -12 324 60 360 40':'M8 44 C52 60 82 34 120 72 C156 112 200 90 238 130 C274 168 316 132 360 180';return `<svg viewBox="0 0 368 190" preserveAspectRatio="none" aria-hidden="true"><line class="chartgrid" x1="0" y1="45" x2="368" y2="45"/><line class="chartgrid" x1="0" y1="95" x2="368" y2="95"/><line class="chartgrid" x1="0" y1="145" x2="368" y2="145"/><g class="candles"><rect x="28" y="116" width="18" height="44" fill="rgba(37,211,102,.45)"/><rect x="76" y="92" width="18" height="52" fill="rgba(37,211,102,.55)"/><rect x="124" y="62" width="18" height="70" fill="rgba(37,211,102,.72)"/><rect x="172" y="40" width="18" height="84" fill="rgba(255,223,89,.65)"/><rect x="220" y="60" width="18" height="72" fill="rgba(240,51,47,.62)"/><rect x="268" y="94" width="18" height="64" fill="rgba(240,51,47,.72)"/></g><path class="chartline ${cls}" d="${path}"/></svg>`;}
function cockpit(node,attempt,scenario){const vis=visual(node,attempt);return `<section class="cockpit"><div class="market"><div class="ticker"><div class="metric cash ${vis.cls}"><small>Cash-out</small><b>$${vis.cash}</b></div><div class="metric"><small>Position</small><b>${vis.position?('$'+Math.abs(vis.position)):'Watch'}</b></div><div class="metric"><small>Timer</small><b>${vis.time}:00</b></div></div><div class="chart">${chart(vis)}</div><div class="tabs"><div class="tab ${vis.rules==='Buried'?'hot':''}"><small>Rules</small><b>${esc(vis.rules)}</b></div><div class="tab ${vis.source==='Pending'?'hot':''}"><small>Official source</small><b>${esc(vis.source)}</b></div><div class="tab"><small>Order book</small><b>${esc(vis.book)}</b></div><div class="tab"><small>Risk</small><b>${esc(vis.risk)}</b></div></div></div><div class="side"><div class="scenehead"><small>Move ${vis.moves+1} · ${esc(scenario.title)}</small><h2>${esc(node.scene||scenario.title)}</h2><p>${esc(node.prompt)}</p></div><div class="feed"><h3>Live feed</h3>${feed(node,vis)}</div><div class="actionrail"><h3>Available actions</h3>${node.choices.map(c=>`<button class="choice" data-choice="${esc(c.id)}"><strong>${esc(c.label)}</strong></button>`).join('')}</div></div></section>`;}
async function scenario(){const sid=scenarioId();page(`<div class="between"><div><div class="pulse"></div><p class="eyebrow">Opening case</p><h1>The market loads.</h1></div></div>`);try{const started=await api('/api/forge/attempts',{method:'POST',body:JSON.stringify({scenario_id:sid})});let attempt=started.forge?.attempt,scenario=started.forge?.scenario_summary,current=started.forge?.node;if(!attempt||!current)throw new Error('Attempt did not start correctly');const render=node=>{if(node.choices){page(cockpit(node,attempt,scenario));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{const label=b.textContent;b.disabled=true;page(`<div class="between"><div><div class="pulse"></div><p class="eyebrow">The market moves</p><h1>${esc(label)}</h1></div></div>`);try{const out=await api(`/api/forge/attempts/${attempt.attempt_id}/choice`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});attempt=out.forge?.attempt||attempt;render(out.forge?.node);}catch(e){page(shell('Action failed','The move did not save.',String(e.message||e)));}})}else{const out=node.outcome||attempt.outcome||{};const mistakes=(out.top_mistakes||[]).map(m=>`<div class="row"><b>${esc(m.tag.replaceAll('_',' '))}</b></div>`).join('')||'<p class="copy">No major mistake tags recorded.</p>';const strengths=(out.strengths||[]).map(s=>`<div class="row"><b>${esc(s)}</b></div>`).join('')||'<p class="copy">No strength notes recorded.</p>';page(shell('Case autopsy',out.profile||node.profile||scenario.title,node.result||out.result||'Case complete.',`<div class="result"><p class="copy"><b>Diagnosis:</b> ${esc(node.diagnosis||out.diagnosis||'No diagnosis supplied.')}</p><p class="scar">${esc(node.scar||out.scar||attempt.scar_unlocked||scenario.scar)}</p></div><div class="grid"><div class="card"><small>Profile</small><strong>${esc(out.profile||node.profile||'Complete')}</strong></div><div class="card"><small>Score</small><strong>${esc(out.score_total??attempt.score_total??0)}</strong></div><div class="card"><small>Moves</small><strong>${esc(attempt.choices?.length||0)}</strong></div></div><div class="autopsy"><div><h2>What got you</h2>${mistakes}</div><div><h2>What worked</h2>${strengths}</div></div><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/${encodeURIComponent(sid)}">Run it again</a><a class="button" href="/app/history">View history</a><a class="button" href="/app/second-stake">Back</a></div>`));}};render(current);}catch(e){page(shell('Case failed to load','The scenario did not start.',String(e.message||e)));}}
function route(){if(path==='/')return home();if(path==='/app')return home();if(path==='/app/products')return products();if(path==='/app/second-stake')return secondStake();if(path==='/app/history')return history();if(path.startsWith('/app/second-stake/scenarios/'))return scenario();return home();}
route();
</script>
</body>
</html>
