<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds X-Ray The Ox</title>
  <style>
    body{margin:0;background:#050609;color:#f6f0db;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .shell{max-width:980px;margin:0 auto;padding:30px 18px}
    .panel{border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025));padding:34px;box-shadow:0 30px 90px #000}
    .stripe{height:16px;border-radius:999px;background:linear-gradient(90deg,#f0332f 0 22%,#ffdf59 22% 50%,#25d366 50% 72%,#3482ff 72%);margin-bottom:24px}
    h1{font-size:clamp(48px,8vw,86px);line-height:.9;letter-spacing:-.06em;margin:0 0 22px}
    .lede{font-size:clamp(20px,3vw,31px);color:rgba(246,240,219,.72);line-height:1.25}
    .button{display:inline-block;margin-top:24px;border-radius:999px;background:#ffdf59;color:#080808;padding:14px 18px;font-weight:900;text-decoration:none}
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="stripe"></div>
      <p>THE OX · HYPERLIFT APP LAYER</p>
      <h1>Odds X-Ray has a real app home.</h1>
      <p class="lede">OX-001 replaces the placeholder with the member product shell for Second Stake scenarios, future modules, saved progress, and Forge-connected decision training.</p>
      <a class="button" href="/health">Check health</a>
    </section>
  </main>
</body>
</html>
