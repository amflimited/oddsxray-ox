<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Odds X-Ray · The Ox</title><style>:root{color-scheme:dark;--bg:#050609;--text:#f7f0d8;--muted:rgba(247,240,216,.68);--line:rgba(255,255,255,.14);--card:#11141b;--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,rgba(240,51,47,.22),transparent 34%),radial-gradient(circle at 92% 0,rgba(52,130,255,.2),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:16px 0 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#fff4bd 0 48%,var(--red) 49%);color:#050609;display:grid;place-items:center;font-weight:1000}.nav{display:flex;gap:8px}.nav a,.btn{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.05);font-weight:850}.primary{background:var(--yellow);color:#050609}.panel,.card,.market,.side,.box{border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--card);box-shadow:0 24px 70px rgba(0,0,0,.5)}.panel{padding:clamp(22px,5vw,54px)}.stripe{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:22px}.eyebrow,.label{color:var(--yellow);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:950}h1{font-size:clamp(44px,9vw,92px);line-height:.88;letter-spacing:-.07em;margin:10px 0 18px}.lede{font-size:clamp(19px,3vw,30px);line-height:1.23;color:var(--muted);max-width:870px}.copy{color:var(--muted);line-height:1.48}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.card{padding:18px}.card small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:900}.card strong{display:block;font-size:24px;margin:8px 0}.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:14px}.market{overflow:hidden}.ticker{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.metric{padding:13px}.metric small,.tile small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:900}.metric b{display:block;font-size:clamp(25px,6vw,42px)}.cash b{color:var(--green)}.cash.warn b{color:var(--yellow)}.cash.danger b{color:var(--red)}.chart{height:120px;padding:12px}.line{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round}.line.warn{stroke:var(--yellow)}.line.danger{stroke:var(--red)}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}.tile{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px;background:rgba(0,0,0,.22)}.tile b{font-size:12px}.side{padding:18px}.scene h2{font-size:clamp(32px,7vw,48px);line-height:.95;letter-spacing:-.045em;margin:8px 0 12px}.scene p{color:var(--muted);line-height:1.45}.box{padding:14px;margin-top:14px;border-radius:20px}.feedline{border-top:1px solid rgba(255,255,255,.08);padding:8px 0;color:var(--muted);font-size:14px}.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin-top:10px}.evidence{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(0,0,0,.22);padding:12px;color:var(--text);text-align:left;cursor:pointer;width:100%}.evidence.inspected{border-color:rgba(37,211,102,.75);box-shadow:inset 0 0 0 1px rgba(37,211,102,.18)}.evidence.inspected:after{content:'INSPECTED';display:inline-block;margin-top:8px;color:var(--green);font-size:10px;letter-spacing:.15em;font-weight:950}.evidence b{display:block;margin:5px 0}.evidence p{margin:0;color:var(--muted);font-size:13px;line-height:1.34}.choice{width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.24);color:var(--text);padding:14px;text-align:left;margin:0 0 9px;cursor:pointer}.choice:hover,.evidence:hover{border-color:rgba(255,223,89,.7);background:rgba(255,223,89,.07)}.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:6px}.between{display:grid;place-items:center;min-height:58vh;text-align:center}.scar{display:inline-block;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:13px 15px;color:#fff6ce;font-weight:900}.row{border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;background:rgba(0,0,0,.22)}.bad{color:#ffb3b3}.good{color:#bdf8cf}footer{display:flex;justify-content:space-between;color:rgba(247,240,216,.42);font-size:13px;padding:14px 4px}@media(max-width:860px){.wrap{width:100%;padding:10px 8px 28px}.nav{display:none}.panel{padding:20px;border-radius:22px}h1{font-size:50px}.cockpit{display:block}.market{border-radius:20px}.ticker{position:sticky;top:0;z-index:2}.metric{padding:8px}.metric small{font-size:9px}.metric b{font-size:25px}.chart{height:82px}.tiles{gap:5px;padding:7px}.tile{padding:6px}.tile small{font-size:7px}.tile b{font-size:11px}.side{margin-top:10px;padding:14px;border-radius:20px}.scene h2{font-size:31px}.egrid{display:flex;overflow-x:auto;padding-bottom:4px}.evidence{min-width:215px}.feedline:nth-of-type(n+3){display:none}.actionsBox{position:sticky;bottom:0;z-index:5;background:rgba(12,14,20,.96);backdrop-filter:blur(14px)}.choice small{display:none}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/"><span class="mark">OX</span><div><b>Odds X-Ray</b><div class="copy">The Ox</div></div></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a></nav></header><div id="app"></div><footer><b>OX-011A</b><span>Single runtime · no Forge VM dependency.</span></footer></main><script>
const app=document.getElementById('app'),path=location.pathname.replace(/\/$/,'')||'/';
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const page=h=>{app.innerHTML=h;scrollTo({top:0,behavior:'smooth'})};
async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o,headers:{'content-type':'application/json',...(o.headers||{})}});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||d.forge?.error||'Request failed');return d.forge||d}
function shell(e,t,l,b=''){return `<section class="panel"><div class="stripe"></div><p class="eyebrow">${esc(e)}</p><h1>${esc(t)}</h1><p class="lede">${esc(l)}</p>${b}</section>`}
function home(){page(shell('Odds X-Ray training chamber','The Ox is the decision lab.','Second Stake now runs inside Ox, so product updates deploy through Hyperlift only. No SSH, no curl, no second server mismatch.',`<div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window?v=011a">Enter The $180 Window</a><a class="btn" href="/app/second-stake?v=011a">View Second Stake</a><a class="btn" href="/api/packages?v=011a">Live package status</a></div><div class="grid"><div class="card"><small>Product 001</small><strong>Second Stake</strong><p class="copy">Rules, source checks, depth, exit discipline, and autopsy.</p></div><div class="card"><small>New</small><strong>Single runtime</strong><p class="copy">The game engine is embedded in Ox now.</p></div><div class="card"><small>New</small><strong>Tracked evidence</strong><p class="copy">The autopsy records what was inspected and what was ignored.</p></div></div>`))}
function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is the first product in the library.',`<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">First-run simulation training.</p></a><div class="card"><small>Future</small><strong>Headline Poison</strong><p class="copy">A story can be true and still fail the contract.</p></div></div>`))}
async function secondStake(){page(shell('Product 001','Loading Second Stake','Reading the embedded Forge catalog.'));try{const d=await api('/api/forge/scenarios?v=011a'),s=d.scenarios||[],cards=s.map(x=>`<a class="card" href="${x.status==='locked'?'#':'/app/second-stake/scenarios/'+encodeURIComponent(x.id)+'?v=011a'}"><small>${x.status==='locked'?'Locked case':'Playable case'} · ${esc(x.format||'')}</small><strong>${esc(x.title)}</strong><p class="copy">${esc(x.subtitle||x.scar||'')}</p>${x.status==='locked'?'<p class="copy">Locked until Scenario 01 proves the format.</p>':'<p class="scar">Start case</p>'}</a>`).join('');page(shell('Product 001','Second Stake','Controlled first-run training with a cockpit, evidence board, decision tree, and behavioral autopsy.',`<div class="grid">${cards}</div><div class="actions"><a class="btn" href="/app/history?v=011a">View attempts</a></div>`))}catch(e){page(shell('Second Stake unavailable','The engine did not return the catalog.',String(e.message||e)))}}
async function history(){page(shell('History','Loading attempt history','The Ox is reading recorded decisions.'));try{const [a,p]=await Promise.all([api('/api/forge/attempts?v=011a'),api('/api/forge/progress?v=011a')]),rows=(a.attempts||[]).map(x=>`<div class="row"><b>${esc(x.scenario_title||x.scenario_id)}</b><p class="copy">${esc(x.status)} · ${esc(x.choices_count)} moves · ${esc(x.evidence_inspections_count||0)} evidence inspections · ${esc(x.profile||'unfinished')}</p>${x.scar_unlocked?`<p class="scar">${esc(x.scar_unlocked)}</p>`:''}</div>`).join('')||'<p class="copy">No attempts recorded yet.</p>',q=p.progress||{};page(shell('Attempt history','The Ox remembers the scar tissue.','Each completed run becomes a behavioral autopsy.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${q.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${q.completed_attempts||0}</strong></div><div class="card"><small>Evidence inspections</small><strong>${q.evidence_inspections||0}</strong></div></div><div>${rows}</div><div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/s01-the-180-window?v=011a">Run The $180 Window</a></div>`))}catch(e){page(shell('History unavailable','Attempt history did not load.',String(e.message||e)))}}
function scenarioId(){const p='/app/second-stake/scenarios/';return decodeURIComponent(path.startsWith(p)?path.slice(p.length):'s01-the-180-window')}
function screen(n){const s=n?.screen||{cashout:171,position:'$100',timer:'8:00',rules:'Buried',source:'Pending',book:'Thin',risk:'Rising',chart:'up',feed:['System loaded.']};let cash=Number(s.cashout||0),cls=cash<=75?'danger':cash<=150?'warn':'';return{cash,cls,position:s.position||'Watch',timer:s.timer||'--',rules:s.rules||'Unknown',source:s.source||'Pending',book:s.book||'Thin',risk:s.risk||'Unknown',chart:s.chart||'flat',feed:Array.isArray(s.feed)?s.feed:[]}}
function chart(v){const p=v.chart==='up'?'M8 150 C50 124 74 138 112 90 C150 42 190 70 238 28 C292 -12 324 60 360 40':v.chart==='down'?'M8 44 C52 60 82 34 120 72 C156 112 200 90 238 130 C274 168 316 132 360 180':v.chart==='warn'?'M8 84 C48 78 92 64 132 78 C174 92 206 82 244 102 C284 122 322 108 360 126':'M8 96 C52 90 90 102 132 94 C178 86 210 104 252 94 C294 84 326 100 360 92';return`<svg viewBox="0 0 368 190" preserveAspectRatio="none"><path class="line ${v.cls}" d="${p}"/><rect x="28" y="116" width="18" height="44" fill="rgba(37,211,102,.45)"/><rect x="124" y="62" width="18" height="70" fill="rgba(255,223,89,.65)"/><rect x="220" y="60" width="18" height="72" fill="rgba(240,51,47,.62)"/></svg>`}
function seen(a,nodeId){return new Set((a.evidence_inspections||[]).filter(x=>x.node_id===nodeId).map(x=>x.evidence_id))}
function evidence(n,a){const ev=Array.isArray(n.evidence)?n.evidence:[];if(!ev.length)return '';const s=seen(a,n.id);return`<div class="box"><span class="label">Evidence board · tap to inspect</span><div class="egrid">${ev.map(e=>`<button class="evidence ${s.has(e.id)?'inspected':''}" data-evidence="${esc(e.id)}"><span class="label">${esc(e.type||'evidence')}</span><b>${esc(e.label)}</b><p>${esc(e.display||e.text||'')}</p>${e.basis?`<p>${esc(e.basis)}</p>`:''}</button>`).join('')}</div></div>`}
function cockpit(n,a,s){const v=screen(n),cash=v.position==='No trade'?'—':'$'+v.cash;return`<section class="cockpit"><div class="market"><div class="ticker"><div class="metric cash ${v.cls}"><small>Exit</small><b>${cash}</b></div><div class="metric"><small>Position</small><b>${esc(v.position)}</b></div><div class="metric"><small>Timer</small><b>${esc(v.timer)}</b></div></div><div class="chart">${chart(v)}</div><div class="tiles"><div class="tile"><small>Rules</small><b>${esc(v.rules)}</b></div><div class="tile"><small>Source</small><b>${esc(v.source)}</b></div><div class="tile"><small>Book</small><b>${esc(v.book)}</b></div><div class="tile"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><div class="side"><div class="scene"><span class="label">Move ${(a.choices?.length||0)+1} · ${esc(s.title)}</span><h2>${esc(n.scene||s.title)}</h2><p>${esc(n.copy||n.prompt||'')}</p></div>${evidence(n,a)}<div class="box"><span class="label">Live feed</span>${v.feed.map(x=>`<div class="feedline">${esc(x)}</div>`).join('')}</div><div class="box actionsBox"><span class="label">Available actions</span>${(n.choices||[]).map(c=>`<button class="choice" data-choice="${esc(c.id)}"><strong>${esc(c.label)}</strong>${c.consequence?`<small>${esc(c.consequence)}</small>`:''}</button>`).join('')}</div></div></section>`}
function timeline(o){const t=o.timeline||[];if(!t.length)return '';return`<h2>Decision autopsy timeline</h2>${t.map(x=>`<div class="row"><b>Move ${x.move}: ${esc(x.label)}</b>${x.consequence?`<p class="copy">${esc(x.consequence)}</p>`:''}${(x.missed_evidence||[]).length?`<p class="bad">Missed before acting: ${x.missed_evidence.map(e=>esc(e.label)).join(', ')}</p>`:'<p class="good">No missed evidence recorded for this move.</p>'}</div>`).join('')}`}
function missed(o){const m=o.missed_evidence||[];return m.length?m.slice(0,8).map(e=>`<div class="row"><b>${esc(e.label)}</b><p class="copy">${esc(e.basis||'Evidence was available before the decision.')}</p></div>`).join(''):'<p class="good">No missed evidence recorded.</p>'}
async function scenario(){const sid=scenarioId();page('<div class="between"><div><p class="eyebrow">Opening case</p><h1>The system loads.</h1></div></div>');try{const s0=await api('/api/forge/attempts?v=011a',{method:'POST',body:JSON.stringify({scenario_id:sid})});let a=s0.attempt,s=s0.scenario_summary,n=s0.node;if(!a||!n)throw new Error('Attempt did not start correctly');const render=node=>{if(node.choices){page(cockpit(node,a,s));document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const out=await api(`/api/forge/attempts/${a.attempt_id}/evidence?v=011a`,{method:'POST',body:JSON.stringify({node_id:node.id,evidence_id:b.dataset.evidence})});a=out.attempt||a;b.classList.add('inspected')}catch(e){b.disabled=false;alert('Evidence did not save.')}});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{b.disabled=true;page(`<div class="between"><div><p class="eyebrow">State changes</p><h1>${esc(b.textContent)}</h1></div></div>`);try{const out=await api(`/api/forge/attempts/${a.attempt_id}/choice?v=011a`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});a=out.attempt||a;render(out.node)}catch(e){page(shell('Action failed','The move did not save.',String(e.message||e)))}})}else{const o=node.outcome||a.outcome||{},v=screen(node),mist=(o.top_mistakes||[]).map(m=>`<div class="row"><b>${esc(String(m.tag).replaceAll('_',' '))}</b></div>`).join('')||'<p class="copy">No major pattern tags recorded.</p>';page(shell('Case autopsy',o.profile||node.profile||s.title,node.result||o.result||'Case complete.',`<div class="market" style="margin:18px 0"><div class="ticker"><div class="metric cash ${v.cls}"><small>Final value</small><b>${v.position==='No trade'?'—':'$'+v.cash}</b></div><div class="metric"><small>Final state</small><b>${esc(v.position)}</b></div><div class="metric"><small>Risk</small><b>${esc(v.risk)}</b></div></div></div><p class="copy"><b>Diagnosis:</b> ${esc(node.diagnosis||o.diagnosis||'No diagnosis supplied.')}</p><p class="scar">${esc(node.scar||o.scar||a.scar_unlocked||s.scar)}</p><div class="grid"><div class="card"><small>Profile</small><strong>${esc(o.profile||node.profile||'Complete')}</strong></div><div class="card"><small>Score</small><strong>${esc(o.score_total??a.score_total??0)}</strong></div><div class="card"><small>Evidence inspected</small><strong>${esc((o.inspected_evidence||[]).length)}</strong></div></div>${timeline(o)}<h2>Missed evidence</h2>${missed(o)}<h2>Pattern tags</h2>${mist}<div class="actions"><a class="btn primary" href="/app/second-stake/scenarios/${encodeURIComponent(sid)}?v=011a">Run it again</a><a class="btn" href="/app/history?v=011a">View history</a><a class="btn" href="/app/second-stake?v=011a">Back</a></div>`))}};render(n)}catch(e){page(shell('Case failed to load','The scenario did not start.',String(e.message||e)))}}
function route(){if(path==='/')return home();if(path==='/app')return home();if(path==='/app/products')return products();if(path==='/app/second-stake')return secondStake();if(path==='/app/history')return history();if(path.startsWith('/app/second-stake/scenarios/'))return scenario();return home()}route();
</script></body></html>
