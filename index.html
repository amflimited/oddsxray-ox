<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds X-Ray · The Ox</title>
  <style>
    :root{color-scheme:dark;--bg:#050609;--panel:rgba(18,20,27,.88);--line:rgba(255,255,255,.14);--text:#f6f0db;--muted:rgba(246,240,219,.68);--red:#f0332f;--yellow:#ffdf59;--green:#25d366;--blue:#3482ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 5%,rgba(240,51,47,.22),transparent 32%),radial-gradient(circle at 88% 10%,rgba(52,130,255,.20),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#fff6ce 0 48%,var(--red) 49%);color:#080808;display:grid;place-items:center;font-weight:950;box-shadow:12px 12px 0 rgba(52,130,255,.18)}.brand b,.brand em{display:block}.brand em{font-style:normal;color:var(--muted);font-size:13px}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a,.button{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:rgba(255,255,255,.04);font-weight:800}.button.primary{background:var(--yellow);color:#080808;border-color:rgba(255,223,89,.8)}button.button{color:inherit;font:inherit;cursor:pointer}.panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.55);padding:clamp(24px,5vw,54px);margin-bottom:18px}.panel:after{content:"";position:absolute;inset:auto -10% -12% -10%;height:140px;background:linear-gradient(110deg,transparent 0 14%,rgba(52,130,255,.40) 15% 32%,transparent 33% 47%,rgba(240,51,47,.45) 48% 61%,rgba(255,223,89,.26) 62% 73%,rgba(37,211,102,.25) 74% 88%,transparent 89%);opacity:.30;pointer-events:none}.stripe{height:16px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 22%,var(--yellow) 22% 50%,var(--green) 50% 72%,var(--blue) 72%);margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.20em;color:var(--yellow);font-weight:950;font-size:12px}h1{font-size:clamp(44px,8vw,88px);line-height:.9;letter-spacing:-.07em;margin:8px 0 20px}.lede{font-size:clamp(19px,3vw,31px);line-height:1.25;color:var(--muted);max-width:880px}.copy{font-size:18px;line-height:1.55;color:var(--muted);max-width:880px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:26px}.card,.choice{border:1px solid var(--line);border-radius:22px;background:rgba(0,0,0,.24);padding:18px;text-align:left}.card small{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:900}.card strong{display:block;font-size:25px;margin:8px 0}.choice{width:100%;color:var(--text);font:inherit;cursor:pointer}.choice:hover{border-color:rgba(255,223,89,.7);background:rgba(255,223,89,.08)}.result{border-left:7px solid var(--red);padding-left:18px}.scar{display:inline-block;margin-top:12px;border-radius:16px;background:rgba(255,223,89,.12);border:1px solid rgba(255,223,89,.35);padding:14px 16px;color:#fff6ce;font-weight:900}.status{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(246,240,219,.55);font-size:13px;margin-top:18px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.history{margin-top:20px}.row{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:rgba(0,0,0,.24)}footer{display:flex;justify-content:space-between;gap:12px;color:rgba(246,240,219,.45);font-size:13px;padding:16px 4px}@media(max-width:760px){.nav{display:none}.panel{border-radius:26px}.mark{width:46px;height:46px}h1{font-size:52px}.lede{font-size:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="mark">OX</span><span><b>Odds X-Ray</b><em>The Ox</em></span></a><nav class="nav"><a href="/app">App</a><a href="/app/products">Products</a><a href="/app/second-stake">Second Stake</a><a href="/app/history">History</a><a href="/health">Health</a></nav></header>
    <div id="app"></div>
    <footer><b>OX-004</b><span>The Site sells. The Ox trains. The Forge remembers.</span></footer>
  </main>
  <script>
    const app=document.getElementById('app');
    const path=location.pathname.replace(/\/$/,'')||'/';
    const page=(html)=>{app.innerHTML=html};
    const shell=(eyebrow,title,lede,body='')=>`<section class="panel"><div class="stripe"></div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="lede">${lede}</p>${body}</section>`;
    async function api(url, opts={}){const r=await fetch(url,{cache:'no-store',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.forge?.error||data.error||'Request failed');return data;}
    function home(){page(shell('The Ox · Hyperlift app layer','Odds X-Ray has a real app home.','OX-004 records scenario attempts and scar lessons through The Forge.','<div class="actions"><a class="button primary" href="/app/second-stake/scenarios/green-number-trap">Open Green Number Trap</a><a class="button" href="/app/history">View History</a><a class="button" href="/api/forge/progress">Raw Progress</a></div><div class="grid"><div class="card"><small>Layer</small><strong>The Ox</strong><p class="copy">Customer-facing product experience.</p></div><div class="card"><small>Build</small><strong>OX-004</strong><p class="copy">Attempt saving and scar unlocks.</p></div><div class="card"><small>Forge</small><strong>Recording</strong><p class="copy">Decision chains are saved by The Forge.</p></div></div>'))}
    function products(){page(shell('Odds X-Ray Library','Products are modules, not one giant course.','Second Stake is Product 001. Future modules can sit beside it without changing the platform.','<div class="grid"><a class="card" href="/app/second-stake"><small>Product 001</small><strong>Second Stake</strong><p class="copy">Ten brutal interactive scenarios that make the first-loss lesson hurt enough to remember.</p></a><div class="card"><small>Future module</small><strong>Cash-Out Scars</strong><p class="copy">Exit windows, greed, partial sells, and one more tick.</p></div><div class="card"><small>Future module</small><strong>Headline Poison</strong><p class="copy">When the story was right but the contract paid something else.</p></div></div>'))}
    function secondStake(){page(shell('Product 001','Second Stake','A ten-scenario burn course for people who already got cooked once.','<p class="copy">No play-money stockbroker cosplay. Second Stake is controlled pain: choice, consequence, diagnosis, scar lesson.</p><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/green-number-trap">Start The Green Number Trap</a><a class="button" href="/app/history">View attempts</a><a class="button" href="/api/forge/scenarios">View Forge Source</a></div>'))}
    async function history(){
      page(shell('History','Loading attempt history','The Ox is asking The Forge for recorded decisions.'));
      try{const [attempts,progress]=await Promise.all([api('/api/forge/attempts'),api('/api/forge/progress')]);const rows=(attempts.forge?.attempts||[]).map(a=>`<div class="row"><b>${a.scenario_id}</b><p class="copy">Status: ${a.status} · Choices: ${a.choices_count} · Scar: ${a.scar_unlocked||'none yet'}</p><p class="status">${a.attempt_id}</p></div>`).join('')||'<p class="copy">No attempts recorded yet.</p>';const p=progress.forge?.progress||{};page(shell('Attempt history','The Forge is remembering.','Every completed run becomes a saved scar lesson.',`<div class="grid"><div class="card"><small>Total attempts</small><strong>${p.total_attempts||0}</strong></div><div class="card"><small>Completed</small><strong>${p.completed_attempts||0}</strong></div><div class="card"><small>Scars unlocked</small><strong>${p.scars_unlocked||0}</strong></div></div><div class="history">${rows}</div><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/green-number-trap">Run another</a></div>`));}catch(e){page(shell('History unavailable','The Forge did not return history.',String(e.message||e)));}
    }
    async function scenario(){
      page(shell('Second Stake · Scenario 01','Starting The Green Number Trap','The Ox is creating a saved attempt in The Forge.','<p class="status">POST /api/forge/attempts</p>'));
      try{
        const started=await api('/api/forge/attempts',{method:'POST',body:JSON.stringify({scenario_id:'green-number-trap'})});
        let attempt=started.forge?.attempt; let scenario=started.forge?.scenario_summary; let current=started.forge?.node;
        if(!attempt||!current)throw new Error('Attempt did not start correctly');
        const renderNode=(node)=>{
          if(node.choices){
            page(shell('Second Stake · Scenario 01',scenario.title,node.prompt,`<div class="grid">${node.choices.map(c=>`<button class="choice" data-choice="${c.id}"><strong>${c.label}</strong></button>`).join('')}</div><p class="scar">${scenario.scar}</p><p class="status">Attempt: ${attempt.attempt_id}</p>`));
            document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{b.disabled=true;page(shell('Recording choice','The Forge is saving your decision.',b.textContent,'<p class="status">POST choice</p>'));try{const out=await api(`/api/forge/attempts/${attempt.attempt_id}/choice`,{method:'POST',body:JSON.stringify({node_id:node.id,choice_id:b.dataset.choice})});attempt=out.forge?.attempt||attempt;renderNode(out.forge?.node);}catch(e){page(shell('Choice failed','The Forge rejected the decision.',String(e.message||e)));}});
          }else{
            page(shell('Scar unlocked',scenario.title,node.result||'Outcome reached.',`<div class="result"><p class="copy"><b>Diagnosis:</b> ${node.diagnosis||attempt.outcome?.diagnosis||'No diagnosis supplied.'}</p><p class="scar">${node.scar||attempt.scar_unlocked||scenario.scar}</p></div><div class="actions"><a class="button primary" href="/app/second-stake/scenarios/green-number-trap">Run it again</a><a class="button" href="/app/history">View history</a><a class="button" href="/app/second-stake">Back to Second Stake</a></div><p class="status">Saved attempt: ${attempt.attempt_id}</p>`));
          }
        };
        renderNode(current);
      }catch(e){page(shell('Forge connection failed','The scenario did not load.',String(e.message||e),'<div class="actions"><a class="button" href="/api/forge/scenarios/green-number-trap">Open raw Forge proxy</a></div>'))}
    }
    function route(){ if(path==='/')return home(); if(path==='/app')return home(); if(path==='/app/products')return products(); if(path==='/app/second-stake')return secondStake(); if(path==='/app/history')return history(); if(path==='/app/second-stake/scenarios/green-number-trap')return scenario(); return home(); }
    route();
  </script>
</body>
</html>
