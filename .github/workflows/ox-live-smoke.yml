# trigger-bump: force first visible run after workflow creation
name: Ox live smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ox-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait briefly for Hyperlift deploy
        run: sleep 45

      - name: Verify Ox health
        run: |
          set -euo pipefail
          echo "Fetching /health"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://ox.oddsxray.com/health -o health.json
          cat health.json
          grep -q '"ok": true' health.json
          grep -q '"build": "OX-013B"' health.json
          grep -q '"noindex": false' health.json
          grep -q '"development_visibility": "assistant-verifiable"' health.json

      - name: Verify Ox package status
        run: |
          set -euo pipefail
          echo "Fetching /api/packages"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://ox.oddsxray.com/api/packages -o packages.json
          cat packages.json
          grep -q '"ok": true' packages.json
          grep -q '"build": "OX-013B"' packages.json
          grep -q '"ox_noindex": false' packages.json
          grep -q '"development_visibility": "assistant-verifiable"' packages.json
