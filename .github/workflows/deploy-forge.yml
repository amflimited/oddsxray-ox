name: Validate Ox Runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-ox-runtime
  cancel-in-progress: true

jobs:
  validate-ox-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Node version
        run: node --version

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check local-forge.js

      - name: Smoke test Ox and embedded Forge
        run: |
          node server.js > /tmp/ox.log 2>&1 &
          PID=$!
          trap 'cat /tmp/ox.log || true; kill $PID 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/api/packages
          curl -fsS http://127.0.0.1:3000/api/forge/scenarios
          curl -fsS -X POST http://127.0.0.1:3000/api/forge/attempts -H 'content-type: application/json' -d '{"scenario_id":"s01-the-180-window"}'
